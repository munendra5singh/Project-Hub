<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="sdgSociety" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="sdgEconomy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="sdgEnvironment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="sdgShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="440" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    सतत विकास लक्ष्य (SDGs 2030) के 3 स्तंभ एवं भारत का दृष्टिकोण
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="12" fill="#64748b">
    ब्रंटलैंड रिपोर्ट (1987) 'Our Common Future' एवं नीति आयोग (NITI Aayog) SDG इंडिया इंडेक्स
  </text>

  <!-- 3 Pillar Cards -->
  <!-- 1. Social Pillar -->
  <g transform="translate(40, 85)" filter="url(#sdgShadow)">
    <rect width="226" height="255" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="226" height="48" rx="10" fill="url(#sdgSociety)"/>
    <rect y="38" width="226" height="10" fill="url(#sdgSociety)"/>
    <text x="113" y="30" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      1. सामाजिक स्तंभ (Social)
    </text>
    <text x="113" y="70" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#ea580c">लोग (PEOPLE)</text>

    <g transform="translate(16, 85)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15">• SDG 1: शून्य निर्धनता (No Poverty)</text>
      <text y="38">• SDG 2: भुखमरी समाप्ति (Zero Hunger)</text>
      <text y="61">• SDG 3: उत्तम स्वास्थ्य व कल्याण</text>
      <text y="84">• SDG 4: गुणवत्तापूर्ण शिक्षा</text>
      <text y="107">• SDG 5: लैंगिक समानता (Gender)</text>
      <text y="130">• SDG 6: स्वच्छ जल एवं स्वच्छता</text>
      <text y="153">• SDG 10: असमानताओं में कमी</text>
    </g>
  </g>

  <!-- 2. Economic Pillar -->
  <g transform="translate(296, 85)" filter="url(#sdgShadow)">
    <rect width="228" height="255" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="228" height="48" rx="10" fill="url(#sdgEconomy)"/>
    <rect y="38" width="228" height="10" fill="url(#sdgEconomy)"/>
    <text x="114" y="30" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      2. आर्थिक स्तंभ (Economic)
    </text>
    <text x="114" y="70" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#2563eb">समृद्धि (PROSPERITY)</text>

    <g transform="translate(16, 85)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15">• SDG 7: किफायती व स्वच्छ ऊर्जा</text>
      <text y="38">• SDG 8: उत्कृष्ट कार्य व संवृद्धि</text>
      <text y="61">• SDG 9: उद्योग, नवाचार व बुनियादी ढांचा</text>
      <text y="84">• SDG 11: संधारणीय शहर व समुदाय</text>
      <text y="107">• SDG 12: संवहनीय उपभोग व उत्पादन</text>
      <text y="130">• वित्तीय समावेशन (जन धन योजना)</text>
      <text y="153">• चक्रीय अर्थव्यवस्था (Circular Economy)</text>
    </g>
  </g>

  <!-- 3. Environmental Pillar -->
  <g transform="translate(554, 85)" filter="url(#sdgShadow)">
    <rect width="226" height="255" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="226" height="48" rx="10" fill="url(#sdgEnvironment)"/>
    <rect y="38" width="226" height="10" fill="url(#sdgEnvironment)"/>
    <text x="113" y="30" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      3. पर्यावरणीय स्तंभ (Planet)
    </text>
    <text x="113" y="70" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#059669">पृथ्वी (PLANET)</text>

    <g transform="translate(16, 85)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15">• SDG 13: जलवायु कार्रवाई (Climate)</text>
      <text y="38">• SDG 14: जलीय जीवन का संरक्षण</text>
      <text y="61">• SDG 15: स्थलीय पारिस्थितिकी व जैवविविधता</text>
      <text y="84">• नवीकरणीय ऊर्जा (अंतर्राष्ट्रीय सौर गठबंधन)</text>
      <text y="107">• मिशन LiFE (पर्यावरण हेतु जीवनशैली)</text>
      <text y="130">• वन आवरण वृद्धि एवं कार्बन सिंक</text>
      <text y="153">• हरित संवृद्धि (Green Growth Policy)</text>
    </g>
  </g>

  <!-- Cross-Cutting Pillar (Peace & Partnership) -->
  <g transform="translate(40, 360)">
    <rect width="740" height="56" rx="8" fill="#1e293b"/>
    <text x="370" y="24" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
      संस्थागत सुशासन व वैश्विक साझेदारी: SDG 16 (शांति, न्याय व सुदृढ़ संस्थाएं) + SDG 17 (लक्ष्यों हेतु साझेदारी)
    </text>
    <text x="370" y="44" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#cbd5e1">
      भारत की प्रतिबद्धता: 2070 तक 'पंचामृत' लक्ष्यों के तहत नेट-जीरो कार्बन उत्सर्जन का ऐतिहासिक राष्ट्रीय संकल्प
    </text>
  </g>
</svg>
