<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="auto" style="font-family: 'Poppins', 'Noto Sans Devanagari', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="poetHdr" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#831843" />
            <stop offset="100%" stop-color="#9d174d" />
        </linearGradient>
        <filter id="pCardSh" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
        </filter>
    </defs>

    <rect width="940" height="520" rx="16" fill="#fffdfa" stroke="#fbcfe8" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="18" width="890" height="58" rx="10" fill="url(#poetHdr)" />
    <text x="470" y="42" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">इकाई-2: निर्धारित 6 प्रमुख कवियों एवं काव्य-धाराओं का तुलनात्मक मानचित्र</text>
    <text x="470" y="62" fill="#fce7f3" font-size="11.5" font-weight="500" text-anchor="middle">आदिकाल, छायावाद, हालावाद, राष्ट्रीय-काव्य एवं प्रगतिवाद के प्रतिनिधि स्वर एवं निर्धारित पाठ्यांश</text>

    <!-- 6 Cards Grid (2 rows x 3 columns) -->

    <!-- Poet 1: Amir Khusro -->
    <g transform="translate(30, 95)" filter="url(#pCardSh)">
        <rect width="280" height="190" rx="10" fill="#ffffff" stroke="#9d174d" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#9d174d" />
        <rect x="0" y="16" width="280" height="14" fill="#9d174d" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. अमीर खुसरो (आदिकाल)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#831843" font-weight="700">रचना:</text>
            <text x="35" y="14" fill="#1f2937">मुकरियाँ (संपादक: सैयद गुलाम समनानी)</text>

            <text x="0" y="34" fill="#831843" font-weight="700">निर्धारित:</text>
            <text x="55" y="34" fill="#4b5563">तारा, जूता, ढोल, बिच्छू (4 मुकरियाँ)</text>

            <text x="0" y="54" fill="#831843" font-weight="700">काव्य-प्रवृत्ति:</text>
            <text x="70" y="54" fill="#4b5563">लोक-रंजन, पहेलीनुमा कौतूहल, विनोद</text>

            <text x="0" y="74" fill="#831843" font-weight="700">भाषा-शिल्प:</text>
            <text x="65" y="74" fill="#4b5563">प्रारंभिक देहलवी/खड़ी बोली, मुकरी छंद</text>

            <rect x="0" y="88" width="252" height="48" rx="6" fill="#fdf2f8" stroke="#fbcfe8" />
            <text x="126" y="106" fill="#9d174d" font-size="9.5" font-weight="600" text-anchor="middle">टेक: 'ऐ सखि साजन? ना सखि...'</text>
            <text x="126" y="122" fill="#4b5563" font-size="9" text-anchor="middle">नायक का भ्रम पैदा कर अंत में अप्रत्याशित उत्तर</text>
        </g>
    </g>

    <!-- Poet 2: Jayashankar Prasad -->
    <g transform="translate(330, 95)" filter="url(#pCardSh)">
        <rect width="280" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#1e40af" />
        <rect x="0" y="16" width="280" height="14" fill="#1e40af" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. जयशंकर प्रसाद (छायावाद)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#1e3a8a" font-weight="700">रचना:</text>
            <text x="35" y="14" fill="#1f2937">'आँसू' (प्रारंभ के 05 छंद)</text>

            <text x="0" y="34" fill="#1e3a8a" font-weight="700">स्वरूप:</text>
            <text x="45" y="34" fill="#4b5563">उत्कृष्ट स्मृति-काव्य एवं विरह-काव्य</text>

            <text x="0" y="54" fill="#1e3a8a" font-weight="700">काव्य-प्रवृत्ति:</text>
            <text x="70" y="54" fill="#4b5563">अंतर्मुखी वेदना, दार्शनिक उदात्तीकरण</text>

            <text x="0" y="74" fill="#1e3a8a" font-weight="700">भाषा-शिल्प:</text>
            <text x="65" y="74" fill="#4b5563">तत्सम प्रधान संस्कृतनिष्ठ खड़ी बोली</text>

            <rect x="0" y="88" width="252" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
            <text x="126" y="106" fill="#1e40af" font-size="9.5" font-weight="600" text-anchor="middle">'जो घनीभूत पीड़ा थी मस्तक में स्मृति-सी छाई'</text>
            <text x="126" y="122" fill="#4b5563" font-size="9" text-anchor="middle">वैयक्तिक विरह का व्यापक मानवता में रूपांतरण</text>
        </g>
    </g>

    <!-- Poet 3: Harivansh Rai Bachchan -->
    <g transform="translate(630, 95)" filter="url(#pCardSh)">
        <rect width="280" height="190" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#b45309" />
        <rect x="0" y="16" width="280" height="14" fill="#b45309" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. हरिवंशराय बच्चन (हालावाद)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#b45309" font-weight="700">रचना:</text>
            <text x="35" y="14" fill="#1f2937">'मधुशाला' (प्रारंभ के 05 छंद)</text>

            <text x="0" y="34" fill="#b45309" font-weight="700">काव्य-दर्शन:</text>
            <text x="65" y="34" fill="#4b5563">हालावाद (उमर खय्याम की रुबाइयों का प्रभाव)</text>

            <text x="0" y="54" fill="#b45309" font-weight="700">दार्शनिक प्रतीक:</text>
            <text x="80" y="54" fill="#4b5563">मधुशाला = जीवन, साकी = प्रेरणा</text>

            <text x="0" y="74" fill="#b45309" font-weight="700">सामाजिक संदेश:</text>
            <text x="85" y="74" fill="#4b5563">धार्मिक संकीर्णता से परे मानवीय एकता</text>

            <rect x="0" y="88" width="252" height="48" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="126" y="106" fill="#b45309" font-size="9.5" font-weight="600" text-anchor="middle">'मंदिर, मस्जिद बैर कराते, मेल कराती मधुशाला'</text>
            <text x="126" y="122" fill="#4b5563" font-size="9" text-anchor="middle">सहज, गेय एवं संगीतात्मक रुबाई शिल्प</text>
        </g>
    </g>

    <!-- Poet 4: Ramdhari Singh Dinkar -->
    <g transform="translate(30, 305)" filter="url(#pCardSh)">
        <rect width="280" height="195" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#991b1b" />
        <rect x="0" y="16" width="280" height="14" fill="#991b1b" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. रामधारी सिंह दिनकर (राष्ट्रकवि)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#991b1b" font-weight="700">कविता:</text>
            <text x="40" y="14" fill="#1f2937">'मेरे नगपति मेरे विशाल'</text>

            <text x="0" y="34" fill="#991b1b" font-weight="700">केंद्रीय विषय:</text>
            <text x="70" y="34" fill="#4b5563">हिमालय का सांस्कृतिक-राष्ट्रीय गौरव</text>

            <text x="0" y="54" fill="#991b1b" font-weight="700">काव्य-रस:</text>
            <text x="50" y="54" fill="#4b5563">वीर रस, ओज गुण, उद्बोधन शैली</text>

            <text x="0" y="74" fill="#991b1b" font-weight="700">आह्वान:</text>
            <text x="42" y="74" fill="#4b5563">पराधीनता की निद्रा त्यागकर शौर्य जगाना</text>

            <rect x="0" y="88" width="252" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" />
            <text x="126" y="106" fill="#991b1b" font-size="9.5" font-weight="600" text-anchor="middle">'मेरे नगपति! मेरे विशाल! साक्षात् रूप अमरता का'</text>
            <text x="126" y="124" fill="#4b5563" font-size="9" text-anchor="middle">हिमालय भारत के आत्म-सम्मान का प्रहरी प्रतीक</text>
        </g>
    </g>

    <!-- Poet 5: Suryakant Tripathi Nirala -->
    <g transform="translate(330, 305)" filter="url(#pCardSh)">
        <rect width="280" height="195" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#047857" />
        <rect x="0" y="16" width="280" height="14" fill="#047857" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5. सूर्यकांत त्रिपाठी 'निराला' (महाप्राण)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#065f46" font-weight="700">कविता:</text>
            <text x="40" y="14" fill="#1f2937">'बाँधो न नाव इस ठाँव बंधु'</text>

            <text x="0" y="34" fill="#065f46" font-weight="700">काव्य-धरातल:</text>
            <text x="75" y="34" fill="#4b5563">गीतिकाव्य, स्मृति, निश्छल प्रेमानुभूति</text>

            <text x="0" y="54" fill="#065f46" font-weight="700">प्रतीकात्मकता:</text>
            <text x="75" y="54" fill="#4b5563">नाव = मन/जीवन, घाट = स्मृति स्थल</text>

            <text x="0" y="74" fill="#065f46" font-weight="700">भाषा-सौंदर्य:</text>
            <text x="65" y="74" fill="#4b5563">लोकधर्मी संगीतात्मकता, कारुणिक माधुर्य</text>

            <rect x="0" y="88" width="252" height="52" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="126" y="106" fill="#047857" font-size="9.5" font-weight="600" text-anchor="middle">'बाँधो न नाव इस ठाँव, बंधु! पूछेगा सारा गाँव, बंधु!'</text>
            <text x="126" y="124" fill="#4b5563" font-size="9" text-anchor="middle">पारिवारिक व व्यक्तिगत वियोग की मर्मस्पर्शी कसक</text>
        </g>
    </g>

    <!-- Poet 6: Nagarjun -->
    <g transform="translate(630, 305)" filter="url(#pCardSh)">
        <rect width="280" height="195" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#4338ca" />
        <rect x="0" y="16" width="280" height="14" fill="#4338ca" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6. नागार्जुन 'बाबा' (जनकवि)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#3730a3" font-weight="700">कविता:</text>
            <text x="40" y="14" fill="#1f2937">'बहुत दिनों तक चूल्हा रोया'</text>

            <text x="0" y="34" fill="#3730a3" font-weight="700">काव्य-धारा:</text>
            <text x="65" y="34" fill="#4b5563">प्रगतिवादी जन-यथार्थवाद</text>

            <text x="0" y="54" fill="#3730a3" font-weight="700">दो विरोधी चित्र:</text>
            <text x="75" y="54" fill="#4b5563">अकाल का सन्नाटा vs अन्न का उल्लास</text>

            <text x="0" y="74" fill="#3730a3" font-weight="700">जीवंत बिंब:</text>
            <text x="60" y="74" fill="#4b5563">चूल्हा, चक्की, कानी कुतिया, छिपकलियाँ, कौआ</text>

            <rect x="0" y="88" width="252" height="52" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
            <text x="126" y="106" fill="#4338ca" font-size="9.5" font-weight="600" text-anchor="middle">'दाने आए घर के अंदर बहुत दिनों के बाद'</text>
            <text x="126" y="124" fill="#4b5563" font-size="9" text-anchor="middle">भूख के संघर्ष और जीवन की पुनर्जीवित आशा का काव्य</text>
        </g>
    </g>
</svg>
