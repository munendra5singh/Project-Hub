<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="auto" style="font-family: 'Poppins', 'Noto Sans Devanagari', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#991b1b" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
        </filter>
        <marker id="timelineArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#b91c1c" />
        </marker>
    </defs>

    <rect width="920" height="480" rx="16" fill="#fffdfa" stroke="#fecaca" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="18" width="870" height="58" rx="10" fill="url(#hdrGrad)" />
    <text x="460" y="42" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">साहित्यिक खड़ी बोली के विकास की ऐतिहासिक विकास-यात्रा</text>
    <text x="460" y="62" fill="#fecaca" font-size="11.5" font-weight="500" text-anchor="middle">प्रारंभिक गद्य के चार स्तंभों से आधुनिक मानक रूप तक का ऐतिहासिक कालक्रम (1800 से अद्यतन)</text>

    <!-- Timeline Central Line -->
    <line x1="60" y1="105" x2="860" y2="105" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="105" x2="850" y2="105" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />

    <!-- Milestones Nodes on Line -->
    <circle cx="140" cy="105" r="14" fill="#991b1b" stroke="#ffffff" stroke-width="3" />
    <text x="140" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1</text>

    <circle cx="360" cy="105" r="14" fill="#d97706" stroke="#ffffff" stroke-width="3" />
    <text x="360" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text>

    <circle cx="580" cy="105" r="14" fill="#047857" stroke="#ffffff" stroke-width="3" />
    <text x="580" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">3</text>

    <circle cx="800" cy="105" r="14" fill="#1e3a8a" stroke="#ffffff" stroke-width="3" />
    <text x="800" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">4</text>

    <!-- Phase 1: Early Pioneers -->
    <g transform="translate(30, 135)" filter="url(#shadowBox)">
        <rect width="220" height="320" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
        <rect x="0" y="0" width="220" height="34" rx="10" fill="#991b1b" />
        <rect x="0" y="20" width="220" height="14" fill="#991b1b" />
        <text x="110" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. प्रारंभिक गद्य के 4 स्तंभ</text>
        <rect x="60" y="38" width="100" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5" />
        <text x="110" y="52" fill="#991b1b" font-size="10" font-weight="700" text-anchor="middle">फोर्ट विलियम कॉलेज युग</text>

        <g transform="translate(14, 70)" font-size="10.5">
            <text x="0" y="16" fill="#7f1d1d" font-weight="700">• मुंशी इंशा अल्ला खाँ</text>
            <text x="10" y="32" fill="#4b5563">रचना: 'रानी केतकी की कहानी'</text>
            <text x="10" y="46" fill="#6b7280" font-size="9.5">(ठेठ हिंदी का प्रथम आख्यान)</text>

            <text x="0" y="74" fill="#7f1d1d" font-weight="700">• लल्लू लाल जी</text>
            <text x="10" y="90" fill="#4b5563">रचना: 'प्रेम सागर' (ब्रजरंजित गद्य)</text>

            <text x="0" y="118" fill="#7f1d1d" font-weight="700">• सदल मिश्र</text>
            <text x="10" y="134" fill="#4b5563">रचना: 'नासिकेतोपाख्यान'</text>

            <text x="0" y="162" fill="#7f1d1d" font-weight="700">• मुंशी सदासुखलाल 'नियाज़'</text>
            <text x="10" y="178" fill="#4b5563">रचना: 'सुखसागर' (विष्णु पुराण)</text>

            <rect x="0" y="200" width="192" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" />
            <text x="96" y="216" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">महत्व: खड़ी बोली को गद्य का</text>
            <text x="96" y="229" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">प्राथमिक आधार प्रदान किया।</text>
        </g>
    </g>

    <!-- Phase 2: Bharatendu Era -->
    <g transform="translate(260, 135)" filter="url(#shadowBox)">
        <rect width="210" height="320" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" />
        <rect x="0" y="0" width="210" height="34" rx="10" fill="#d97706" />
        <rect x="0" y="20" width="210" height="14" fill="#d97706" />
        <text x="105" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. भारतेंदु युग (1857-1900)</text>
        <rect x="55" y="38" width="100" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" />
        <text x="105" y="52" fill="#b45309" font-size="10" font-weight="700" text-anchor="middle">नवजागरण काल</text>

        <g transform="translate(14, 70)" font-size="10.5">
            <text x="0" y="16" fill="#92400e" font-weight="700">• भारतेंदु हरिश्चंद्र</text>
            <text x="10" y="32" fill="#4b5563">गद्य की सर्वमान्य प्रतिष्ठा</text>
            <text x="10" y="46" fill="#6b7280" font-size="9.5">नाटक: 'भारत दुर्दशा', 'सत्य हरिश्चंद्र'</text>

            <text x="0" y="74" fill="#92400e" font-weight="700">• पत्रिकाएं व पत्रकारिता</text>
            <text x="10" y="90" fill="#4b5563">'कविवचन सुधा', 'हरिश्चंद्र मैगजीन'</text>
            <text x="10" y="104" fill="#6b7280" font-size="9.5">'ब्राह्मण' (प्रताप नारायण मिश्र)</text>

            <text x="0" y="132" fill="#92400e" font-weight="700">• भाषा की दोहरी स्थिति</text>
            <text x="10" y="148" fill="#4b5563">गद्य में: खड़ी बोली की विजय</text>
            <text x="10" y="164" fill="#4b5563">पद्य में: ब्रजभाषा का प्रचलन जारी</text>

            <rect x="0" y="200" width="182" height="36" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="91" y="216" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">उद्घोष: 'निज भाषा उन्नति अहै,</text>
            <text x="91" y="229" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">सब उन्नति को मूल'</text>
        </g>
    </g>

    <!-- Phase 3: Dwivedi Era -->
    <g transform="translate(480, 135)" filter="url(#shadowBox)">
        <rect width="210" height="320" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2" />
        <rect x="0" y="0" width="210" height="34" rx="10" fill="#047857" />
        <rect x="0" y="20" width="210" height="14" fill="#047857" />
        <text x="105" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. द्विवेदी युग (1900-1920)</text>
        <rect x="55" y="38" width="100" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" />
        <text x="105" y="52" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">अनुशासन व मानकीकरण</text>

        <g transform="translate(14, 70)" font-size="10.5">
            <text x="0" y="16" fill="#065f46" font-weight="700">• महावीर प्रसाद द्विवेदी</text>
            <text x="10" y="32" fill="#4b5563">1903 से 'सरस्वती' का संपादन</text>
            <text x="10" y="46" fill="#6b7280" font-size="9.5">व्याकरणिक शुद्धि व वर्तनी परिष्कार</text>

            <text x="0" y="74" fill="#065f46" font-weight="700">• पद्य में खड़ी बोली की प्रतिष्ठा</text>
            <text x="10" y="90" fill="#4b5563">ब्रजभाषा का पद्य से विस्थापन</text>
            <text x="10" y="104" fill="#6b7280" font-size="9.5">खड़ी बोली बनी काव्य-भाषा</text>

            <text x="0" y="132" fill="#065f46" font-weight="700">• प्रमुख युगीन कृतियां</text>
            <text x="10" y="148" fill="#4b5563">मैथिलीशरण गुप्त: 'भारत-भारती'</text>
            <text x="10" y="164" fill="#4b5563">हरिऔध: 'प्रियप्रवास' (प्रथम महाकाव्य)</text>

            <rect x="0" y="200" width="182" height="36" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="91" y="216" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">उपलब्धि: गद्य और पद्य दोनों की</text>
            <text x="91" y="229" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">एकमात्र भाषा बनी खड़ी बोली।</text>
        </g>
    </g>

    <!-- Phase 4: Chhayavad & Modern -->
    <g transform="translate(700, 135)" filter="url(#shadowBox)">
        <rect width="190" height="320" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
        <rect x="0" y="0" width="190" height="34" rx="10" fill="#1e3a8a" />
        <rect x="0" y="20" width="190" height="14" fill="#1e3a8a" />
        <text x="95" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. छायावाद व आधुनिक युग</text>
        <rect x="45" y="38" width="100" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
        <text x="95" y="52" fill="#1e40af" font-size="10" font-weight="700" text-anchor="middle">भाव व शिल्प का उत्कर्ष</text>

        <g transform="translate(12, 70)" font-size="10.5">
            <text x="0" y="16" fill="#1e3a8a" font-weight="700">• छायावादी चतुष्टय</text>
            <text x="10" y="32" fill="#4b5563">प्रसाद ('कामायनी'), निराला,</text>
            <text x="10" y="46" fill="#4b5563">पंत, महादेवी वर्मा</text>

            <text x="0" y="74" fill="#1e3a8a" font-weight="700">• कथा एवं आलोचना</text>
            <text x="10" y="90" fill="#4b5563">मुंशी प्रेमचंद (उपन्यास सम्राट)</text>
            <text x="10" y="104" fill="#4b5563">रामचंद्र शुक्ल (आलोचना)</text>

            <text x="0" y="132" fill="#1e3a8a" font-weight="700">• प्रगतिवाद व नई कविता</text>
            <text x="10" y="148" fill="#4b5563">दिनकर, बच्चन, नागार्जुन,</text>
            <text x="10" y="164" fill="#4b5563">अज्ञेय, मुक्तिबोध</text>

            <rect x="0" y="200" width="166" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
            <text x="83" y="216" fill="#1e3a8a" font-size="9.5" font-weight="700" text-anchor="middle">संवैधानिक स्थिति: 14 सितंबर</text>
            <text x="83" y="229" fill="#1e3a8a" font-size="9.5" font-weight="700" text-anchor="middle">1949 को भारत की राजभाषा।</text>
        </g>
    </g>
</svg>
