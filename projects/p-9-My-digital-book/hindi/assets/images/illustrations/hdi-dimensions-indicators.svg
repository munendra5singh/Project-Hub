<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="eduGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="incomeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hdiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="hdiCardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="820" height="440" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    मानव विकास सूचकांक (Human Development Index - HDI) की संरचना
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="12" fill="#64748b">
    संयुक्त राष्ट्र विकास कार्यक्रम (UNDP) द्वारा 1990 में प्रो. महबूब-उल-हक एवं प्रो. अमर्त्य सेन द्वारा विकसित
  </text>

  <!-- Level 1: 3 Dimensions Header -->
  <text x="410" y="90" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">
    तीन प्रमुख आयाम (THREE ESSENTIAL DIMENSIONS)
  </text>

  <!-- Column 1: Health -->
  <g transform="translate(40, 105)" filter="url(#hdiCardShadow)">
    <rect width="226" height="60" rx="8" fill="url(#healthGrad)"/>
    <text x="113" y="27" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#ffffff">दीर्घ एवं स्वस्थ जीवन</text>
    <text x="113" y="47" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#fee2e2">Long &amp; Healthy Life</text>

    <!-- Connector line -->
    <line x1="113" y1="60" x2="113" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Indicator Card -->
    <rect y="85" width="226" height="90" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <text x="113" y="108" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#dc2626">संकेतक (Indicator)</text>
    <text x="113" y="132" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#1e293b">जन्म के समय जीवन प्रत्याशा</text>
    <text x="113" y="152" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#64748b">(Life Expectancy at Birth)</text>

    <!-- Sub Index -->
    <rect y="185" width="226" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="113" y="208" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600" fill="#991b1b">जीवन प्रत्याशा सूचकांक (I_Life)</text>
  </g>

  <!-- Column 2: Education -->
  <g transform="translate(296, 105)" filter="url(#hdiCardShadow)">
    <rect width="228" height="60" rx="8" fill="url(#eduGrad)"/>
    <text x="114" y="27" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#ffffff">ज्ञान एवं शिक्षा</text>
    <text x="114" y="47" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#dbeafe">Knowledge &amp; Education</text>

    <line x1="114" y1="60" x2="114" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Indicators Card -->
    <rect y="85" width="228" height="90" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="114" y="105" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#2563eb">दो संकेतक (2 Indicators)</text>
    <text x="114" y="125" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">1. स्कूलिंग के अनुमानित वर्ष (EYS)</text>
    <text x="114" y="145" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">2. स्कूलिंग के औसत वर्ष (MYS)</text>

    <!-- Sub Index -->
    <rect y="185" width="228" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="114" y="208" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600" fill="#1e40af">शिक्षा सूचकांक (I_Education)</text>
  </g>

  <!-- Column 3: Decent Standard of Living -->
  <g transform="translate(554, 105)" filter="url(#hdiCardShadow)">
    <rect width="226" height="60" rx="8" fill="url(#incomeGrad)"/>
    <text x="113" y="27" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="14" font-weight="700" fill="#ffffff">सभ्य जीवन स्तर</text>
    <text x="113" y="47" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#d1fae5">Decent Standard of Living</text>

    <line x1="113" y1="60" x2="113" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Indicator Card -->
    <rect y="85" width="226" height="90" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="113" y="108" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#059669">संकेतक (Indicator)</text>
    <text x="113" y="132" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#1e293b">प्रति व्यक्ति सकल राष्ट्रीय आय</text>
    <text x="113" y="152" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#64748b">(GNI Per Capita in PPP $)</text>

    <!-- Sub Index -->
    <rect y="185" width="226" height="36" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="113" y="208" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600" fill="#065f46">आय सूचकांक (I_Income)</text>
  </g>

  <!-- Synthesis Arrows into Final HDI -->
  <path d="M153 336 L153 355 L410 355 M410 336 L410 355 M667 336 L667 355 L410 355" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="410,366 405,356 415,356" fill="#94a3b8"/>

  <!-- Final HDI Formula Card -->
  <g transform="translate(100, 370)" filter="url(#hdiCardShadow)">
    <rect width="620" height="52" rx="10" fill="url(#hdiGrad)"/>
    <text x="310" y="24" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      HDI = ∛ ( I_Life × I_Education × I_Income )
    </text>
    <text x="310" y="42" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#e0e7ff">
      तीनों सूचकांकों का ज्यामितीय माध्य (Geometric Mean) • मान सीमा: 0 से 1 के बीच
    </text>
  </g>
</svg>
