<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="auto" style="font-family: 'Poppins', 'Noto Sans Devanagari', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7f1d1d" />
            <stop offset="100%" stop-color="#991b1b" />
        </linearGradient>
        <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#fff5f5" />
        </linearGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="100%" stop-color="#b45309" />
        </linearGradient>
        <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7f1d1d" flood-opacity="0.12" />
        </filter>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#b91c1c" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="900" height="520" rx="16" fill="#fffdfa" stroke="#fecaca" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="20" width="850" height="60" rx="10" fill="url(#treeGrad)" />
    <text x="450" y="45" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">भारतीय आर्य भाषाओं का ऐतिहासिक विकास एवं खड़ी बोली की उत्पत्ति</text>
    <text x="450" y="66" fill="#fecaca" font-size="12" font-weight="500" text-anchor="middle">प्राचीन भारतीय आर्य भाषा काल (1500 ई.पू.) से आधुनिक मानक हिंदी तक का ऐतिहासिक भाषा-वृक्ष</text>

    <!-- Step 1: Vedic & Classical Sanskrit -->
    <g transform="translate(40, 105)" filter="url(#cardShadow)">
        <rect width="180" height="110" rx="10" fill="url(#boxGrad1)" stroke="#b91c1c" stroke-width="2" />
        <rect x="0" y="0" width="180" height="26" rx="10" fill="#b91c1c" />
        <rect x="0" y="16" width="180" height="10" fill="#b91c1c" />
        <text x="90" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1. प्राचीन आर्य भाषा</text>
        <text x="90" y="48" fill="#7f1d1d" font-size="13" font-weight="700" text-anchor="middle">वैदिक एवं लौकिक संस्कृत</text>
        <text x="90" y="66" fill="#4b5563" font-size="10" text-anchor="middle">काल: 1500 ई.पू. - 500 ई.पू.</text>
        <text x="90" y="82" fill="#6b7280" font-size="9.5" text-anchor="middle">• वेद, उपनिषद, रामायण</text>
        <text x="90" y="98" fill="#6b7280" font-size="9.5" text-anchor="middle">• पाणिनी कृत 'अष्टाध्यायी'</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <line x1="220" y1="160" x2="255" y2="160" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Step 2: Pali (First Prakrit) -->
    <g transform="translate(260, 105)" filter="url(#cardShadow)">
        <rect width="180" height="110" rx="10" fill="url(#boxGrad1)" stroke="#d97706" stroke-width="2" />
        <rect x="0" y="0" width="180" height="26" rx="10" fill="#d97706" />
        <rect x="0" y="16" width="180" height="10" fill="#d97706" />
        <text x="90" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2. मध्यकालीन (प्रथम चरण)</text>
        <text x="90" y="48" fill="#b45309" font-size="13" font-weight="700" text-anchor="middle">पालि भाषा (प्रथम प्राकृत)</text>
        <text x="90" y="66" fill="#4b5563" font-size="10" text-anchor="middle">काल: 500 ई.पू. - 1 ईस्वी</text>
        <text x="90" y="82" fill="#6b7280" font-size="9.5" text-anchor="middle">• भगवान बुद्ध के उपदेश</text>
        <text x="90" y="98" fill="#6b7280" font-size="9.5" text-anchor="middle">• त्रिपिटक साहित्य, सम्राट अशोक</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <line x1="440" y1="160" x2="475" y2="160" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Step 3: Prakrit (Second Prakrit) -->
    <g transform="translate(480, 105)" filter="url(#cardShadow)">
        <rect width="180" height="110" rx="10" fill="url(#boxGrad1)" stroke="#b91c1c" stroke-width="2" />
        <rect x="0" y="0" width="180" height="26" rx="10" fill="#b91c1c" />
        <rect x="0" y="16" width="180" height="10" fill="#b91c1c" />
        <text x="90" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3. मध्यकालीन (द्वितीय चरण)</text>
        <text x="90" y="48" fill="#7f1d1d" font-size="13" font-weight="700" text-anchor="middle">प्राकृत (द्वितीय प्राकृत)</text>
        <text x="90" y="66" fill="#4b5563" font-size="10" text-anchor="middle">काल: 1 ईस्वी - 500 ईस्वी</text>
        <text x="90" y="82" fill="#6b7280" font-size="9.5" text-anchor="middle">• महावीर स्वामी के उपदेश</text>
        <text x="90" y="98" fill="#6b7280" font-size="9.5" text-anchor="middle">• गाथासप्तशती, प्राकृत व्याकरण</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <line x1="660" y1="160" x2="695" y2="160" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Step 4: Apabhramsha -->
    <g transform="translate(700, 105)" filter="url(#cardShadow)">
        <rect width="160" height="110" rx="10" fill="url(#boxGrad1)" stroke="#047857" stroke-width="2" />
        <rect x="0" y="0" width="160" height="26" rx="10" fill="#047857" />
        <rect x="0" y="16" width="160" height="10" fill="#047857" />
        <text x="80" y="18" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">4. मध्यकालीन (तृतीय चरण)</text>
        <text x="80" y="48" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">अपभ्रंश / अवहट्ठ</text>
        <text x="80" y="66" fill="#4b5563" font-size="10" text-anchor="middle">काल: 500 ई. - 1000 ई.</text>
        <text x="80" y="82" fill="#6b7280" font-size="9.5" text-anchor="middle">• शौरसेनी अपभ्रंश मुख्य स्रोत</text>
        <text x="80" y="98" fill="#6b7280" font-size="9.5" text-anchor="middle">• स्वयंभू, पुष्पदंत का काव्य</text>
    </g>

    <!-- Downward Arrow from Apabhramsha to Sauraseni & Western Hindi -->
    <path d="M 780 215 L 780 255 L 500 255" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Intermediate Box: Sauraseni Apabhramsha -->
    <g transform="translate(250, 235)" filter="url(#cardShadow)">
        <rect width="240" height="42" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8" />
        <text x="120" y="26" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">शौरसेनी अपभ्रंश (मध्य देश की प्रमुख उपभाषा)</text>
    </g>

    <!-- Arrow down from Sauraseni to Modern Branches -->
    <line x1="370" y1="277" x2="370" y2="310" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Step 5: Western Hindi Branch & Dialects -->
    <g transform="translate(40, 320)" filter="url(#cardShadow)">
        <rect width="360" height="175" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
        <rect x="0" y="0" width="360" height="28" rx="10" fill="#991b1b" />
        <rect x="0" y="18" width="360" height="10" fill="#991b1b" />
        <text x="180" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">पश्चिमी हिंदी उपभाषा वर्ग (5 मुख्य बोलियाँ)</text>

        <!-- Dialects grid -->
        <g transform="translate(15, 38)">
            <rect x="0" y="0" width="155" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" />
            <text x="77" y="18" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">1. खड़ी बोली (कौरवी)</text>
            <text x="77" y="30" fill="#6b7280" font-size="8.5" text-anchor="middle">मेरठ, दिल्ली, मुरादाबाद, सहारनपुर</text>

            <rect x="175" y="0" width="155" height="36" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="252" y="18" fill="#b45309" font-size="11" font-weight="700" text-anchor="middle">2. ब्रजभाषा</text>
            <text x="252" y="30" fill="#6b7280" font-size="8.5" text-anchor="middle">मथुरा, आगरा, अलीगढ़ (सूरदास)</text>

            <rect x="0" y="44" width="155" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
            <text x="77" y="62" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">3. हरियाणवी (बाँगडू)</text>
            <text x="77" y="74" fill="#6b7280" font-size="8.5" text-anchor="middle">रोहतक, करनाल, अंबाला</text>

            <rect x="175" y="44" width="155" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
            <text x="252" y="62" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">4. बुंदेली</text>
            <text x="252" y="74" fill="#6b7280" font-size="8.5" text-anchor="middle">झांसी, ग्वालियर, सागर</text>

            <rect x="88" y="88" width="155" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
            <text x="165" y="106" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">5. कन्नौजी</text>
            <text x="165" y="118" fill="#6b7280" font-size="8.5" text-anchor="middle">कन्नौज, फर्रुखाबाद, इटावा</text>
        </g>
    </g>

    <!-- Central Arrow to Standard Hindi -->
    <path d="M 400 405 L 470 405" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow)" />

    <!-- Step 6: Modern Standard Hindi (Manak Hindi) -->
    <g transform="translate(480, 320)" filter="url(#cardShadow)">
        <rect width="380" height="175" rx="10" fill="url(#boxGrad1)" stroke="#b91c1c" stroke-width="2.5" />
        <rect x="0" y="0" width="380" height="32" rx="10" fill="url(#treeGrad)" />
        <rect x="0" y="20" width="380" height="12" fill="url(#treeGrad)" />
        <text x="190" y="22" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">आधुनिक मानक हिंदी (मानक खड़ी बोली)</text>

        <g transform="translate(16, 42)">
            <text x="0" y="16" fill="#991b1b" font-size="11.5" font-weight="700">• आधार बोली:</text>
            <text x="85" y="16" fill="#374151" font-size="11">कौरवी / खड़ी बोली (देहली-मेरठ अंचल)</text>

            <text x="0" y="38" fill="#991b1b" font-size="11.5" font-weight="700">• लिपि:</text>
            <text x="45" y="38" fill="#374151" font-size="11">देवनागरी (अनुच्छेद 343(1) के तहत संघ की राजभाषा)</text>

            <text x="0" y="60" fill="#991b1b" font-size="11.5" font-weight="700">• मानकीकरण:</text>
            <text x="85" y="60" fill="#374151" font-size="11">महावीर प्रसाद द्विवेदी ('सरस्वती' पत्रिका)</text>

            <text x="0" y="82" fill="#991b1b" font-size="11.5" font-weight="700">• आधुनिक क्षेत्र:</text>
            <text x="90" y="82" fill="#374151" font-size="11">शिक्षा, प्रशासन, न्यायालय, मीडिया व राष्ट्रीय संपर्क</text>

            <!-- Status Pill -->
            <rect x="20" y="96" width="310" height="26" rx="13" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2" />
            <text x="175" y="113" fill="#b91c1c" font-size="10.5" font-weight="700" text-anchor="middle">✓ भारत की संपर्क भाषा एवं आधिकारिक संघ की राजभाषा</text>
        </g>
    </g>
</svg>
