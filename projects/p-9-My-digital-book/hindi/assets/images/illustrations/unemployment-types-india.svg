<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" height="100%">
  <defs>
    <filter id="unempShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="430" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    भारतीय अर्थव्यवस्था में बेरोजगारी के प्रमुख प्रकार
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="12" fill="#64748b">
    श्रम बल (Labor Force), कार्यबल (Workforce) एवं संरचनात्मक व प्रच्छन्न बेरोजगारी का वर्गीकरण
  </text>

  <!-- 4 Grid Cards -->
  <!-- 1. Disguised Unemployment -->
  <g transform="translate(40, 80)" filter="url(#unempShadow)">
    <rect width="345" height="135" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#ea580c"/>
    <rect y="24" width="345" height="8" fill="#ea580c"/>
    <text x="15" y="22" font-family="'Noto Sans Devanagari', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      1. प्रच्छन्न बेरोजगारी (Disguised / छिपी हुई)
    </text>

    <g transform="translate(15, 45)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#c2410c">प्रमुख क्षेत्र: भारतीय कृषि एवं ग्रामीण अर्थव्यवस्था</text>
      <text y="35">• जहां 3 श्रमिकों की आवश्यकता है, वहां परिवार के 6 सदस्य लगे हैं।</text>
      <text y="55">• अतिरिक्त श्रमिकों की सीमांत उत्पादकता शून्य होती है (MP_L = 0)।</text>
      <text y="75" fill="#64748b">हटाने पर भी कुल कृषि उत्पादन पर कोई नकारात्मक असर नहीं पड़ता।</text>
    </g>
  </g>

  <!-- 2. Structural Unemployment -->
  <g transform="translate(435, 80)" filter="url(#unempShadow)">
    <rect width="345" height="135" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#1e3a8a"/>
    <rect y="24" width="345" height="8" fill="#1e3a8a"/>
    <text x="15" y="22" font-family="'Noto Sans Devanagari', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      2. संरचनात्मक बेरोजगारी (Structural Mismatch)
    </text>

    <g transform="translate(15, 45)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#1e40af">प्रमुख कारण: कौशल बेमेल (Skills Mismatch)</text>
      <text y="35">• आधुनिक तकनीक व उद्योगों को डिजिटल/उच्च कौशल चाहिए।</text>
      <text y="55">• शिक्षा प्रणाली पारंपरिक डिग्रियां दे रही है, व्यावसायिक दक्षता नहीं।</text>
      <text y="75" fill="#64748b">नौकरियां उपलब्ध हैं किंतु उपयुक्त प्रशिक्षित उम्मीदवार नहीं मिलते।</text>
    </g>
  </g>

  <!-- 3. Seasonal Unemployment -->
  <g transform="translate(40, 230)" filter="url(#unempShadow)">
    <rect width="345" height="130" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#047857"/>
    <rect y="24" width="345" height="8" fill="#047857"/>
    <text x="15" y="22" font-family="'Noto Sans Devanagari', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      3. मौसमी बेरोजगारी (Seasonal Unemployment)
    </text>

    <g transform="translate(15, 45)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#065f46">प्रमुख क्षेत्र: कृषि व पर्यटन आधारित उद्योग</text>
      <text y="35">• फसल बुवाई एवं कटाई के पीक सीजन में पूर्ण काम मिलता है।</text>
      <text y="55">• वर्ष के शेष 4 से 6 महीने श्रमिक पूरी तरह बेरोजगार रहते हैं।</text>
      <text y="72" fill="#64748b">समाधान: मनरेगा (MGNREGA) एवं ग्रामीण कुटीर उद्योग।</text>
    </g>
  </g>

  <!-- 4. Open Unemployment -->
  <g transform="translate(435, 230)" filter="url(#unempShadow)">
    <rect width="345" height="130" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#6d28d9"/>
    <rect y="24" width="345" height="8" fill="#6d28d9"/>
    <text x="15" y="22" font-family="'Noto Sans Devanagari', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      4. खुली / शिक्षित बेरोजगारी (Open Unemployment)
    </text>

    <g transform="translate(15, 45)" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#5b21b6">लक्षण: योग्यता व इच्छा होते हुए भी काम न मिलना</text>
      <text y="35">• व्यक्ति प्रचलित मजदूरी दर पर कार्य करने को पूर्णतः तत्पर है।</text>
      <text y="55">• अर्थव्यवस्था में पर्याप्त रोजगार अवसर सृजित नहीं हो पा रहे।</text>
      <text y="72" fill="#64748b">शहरी शिक्षित युवाओं में यह समस्या सर्वाधिक मुखर है।</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 375)">
    <rect width="740" height="42" rx="8" fill="#1e293b"/>
    <text x="370" y="26" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">
      प्रमुख सरकारी हस्तक्षेप: मनरेगा (100 दिन गारंटी), स्किल इंडिया, प्रधानमंत्री मुद्रा योजना एवं PLI विनिर्माण प्रोत्साहन
    </text>
  </g>
</svg>
