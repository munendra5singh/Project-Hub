<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" height="100%">
  <defs>
    <linearGradient id="fdiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fiiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="invShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="430" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    विदेशी पूंजी प्रवाह: FDI बनाम FII (हॉट मनी) की तुलना
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Noto Sans Devanagari', 'Poppins', sans-serif" font-size="12" fill="#64748b">
    भारतीय अर्थव्यवस्था में प्रत्यक्ष विदेशी निवेश एवं पोर्टफोलियो निवेश के प्रभाव व स्थिरता का तुलनात्मक विश्लेषण
  </text>

  <!-- Left Card: FDI -->
  <g transform="translate(40, 85)" filter="url(#invShadow)">
    <rect width="345" height="265" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="345" height="48" rx="10" fill="url(#fdiGrad)"/>
    <rect y="38" width="345" height="10" fill="url(#fdiGrad)"/>
    <text x="172" y="30" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      प्रत्यक्ष विदेशी निवेश (FDI)
    </text>

    <g transform="translate(20, 75)" font-family="'Noto Sans Devanagari', sans-serif" font-size="12.5" fill="#1e293b">
      <text y="14" font-weight="700" fill="#1e3a8a">1. निवेश की प्रकृति:</text>
      <text y="34" fill="#475569">दीर्घकालिक एवं स्थाई (कारखाने, संयंत्र, नई तकनीक)</text>

      <text y="64" font-weight="700" fill="#1e3a8a">2. प्रबंधन व नियंत्रण:</text>
      <text y="84" fill="#475569">कंपनी के प्रबंधन में प्रत्यक्ष भागीदारी (&gt;10% शेयर)</text>

      <text y="114" font-weight="700" fill="#1e3a8a">3. आर्थिक प्रभाव:</text>
      <text y="134" fill="#475569">रोजगार सृजन, तकनीक हस्तांतरण, GDP में वृद्धि</text>

      <text y="164" font-weight="700" fill="#1e3a8a">4. गतिशीलता व जोखिम:</text>
      <text y="184" fill="#475569">स्थिर पूंजी, इसे रातों-रात वापस नहीं निकाला जा सकता</text>
    </g>

    <rect x="20" y="220" width="305" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="172" y="240" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">
      ✓ उत्पादन आधारित व स्थिर पूंजी (Stable Capital)
    </text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(390, 205)">
    <circle cx="20" cy="10" r="22" fill="#0f172a"/>
    <text x="20" y="16" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#ffffff">VS</text>
  </g>

  <!-- Right Card: FII / FPI -->
  <g transform="translate(435, 85)" filter="url(#invShadow)">
    <rect width="345" height="265" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="345" height="48" rx="10" fill="url(#fiiGrad)"/>
    <rect y="38" width="345" height="10" fill="url(#fiiGrad)"/>
    <text x="172" y="30" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      विदेशी संस्थागत निवेश (FII / FPI)
    </text>

    <g transform="translate(20, 75)" font-family="'Noto Sans Devanagari', sans-serif" font-size="12.5" fill="#1e293b">
      <text y="14" font-weight="700" fill="#b45309">1. निवेश की प्रकृति:</text>
      <text y="34" fill="#475569">अल्पकालिक वित्तीय निवेश (शेयर, बॉन्ड, प्रतिभूतियां)</text>

      <text y="64" font-weight="700" fill="#b45309">2. प्रबंधन व नियंत्रण:</text>
      <text y="84" fill="#475569">प्रबंधन में कोई नियंत्रण नहीं (&lt;10% वित्तीय होल्डिंग)</text>

      <text y="114" font-weight="700" fill="#b45309">3. आर्थिक प्रभाव:</text>
      <text y="134" fill="#475569">पूंजी बाजार में तरलता (Liquidity) में वृद्धि</text>

      <text y="164" font-weight="700" fill="#b45309">4. गतिशीलता व जोखिम:</text>
      <text y="184" fill="#475569">अत्यधिक अस्थिर — वैश्विक संकेतों पर तत्काल बहिर्वाह</text>
    </g>

    <rect x="20" y="220" width="305" height="30" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="172" y="240" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="11.5" font-weight="700" fill="#b45309">
      ⚠ 'हॉट मनी' (Hot Money) — उच्च मुद्रा विनिमय जोखिम
    </text>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 368)">
    <rect width="740" height="46" rx="8" fill="#1e293b"/>
    <text x="370" y="28" text-anchor="middle" font-family="'Noto Sans Devanagari', sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">
      भारत की नीतिगत प्राथमिकता: FDI को बढ़ावा देना ताकि विनिर्माण (Make in India) व रोजगार में दीर्घकालिक स्थिरता आए
    </text>
  </g>
</svg>
