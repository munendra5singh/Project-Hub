<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="auto" style="font-family: 'Poppins', 'Noto Sans Devanagari', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="gadyaHdr" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#065f46" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <filter id="gCardSh" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
        </filter>
    </defs>

    <rect width="940" height="540" rx="16" fill="#fffdfa" stroke="#d1fae5" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="16" width="890" height="56" rx="10" fill="url(#gadyaHdr)" />
    <text x="470" y="39" fill="#ffffff" font-size="16.5" font-weight="700" text-anchor="middle">इकाई-3: गद्य पाठ्यांश (कहानियां एवं निबंध) का विषयगत व वैचारिक ढांचा</text>
    <text x="470" y="58" fill="#a7f3d0" font-size="11" font-weight="500" text-anchor="middle">खंड (क) 2 अमर कहानियां एवं खंड (ख) 4 युगप्रवर्तक वैचारिक, मनोवैज्ञानिक व व्यंग्य निबंध</text>

    <!-- SECTION A: KAHANIYAN (2 Columns) -->
    <text x="35" y="96" fill="#065f46" font-size="13.5" font-weight="800">खंड (क) कहानियां (Stories)</text>

    <!-- Story 1: Mantra -->
    <g transform="translate(30, 108)" filter="url(#gCardSh)">
        <rect width="425" height="185" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8" />
        <rect x="0" y="0" width="425" height="30" rx="10" fill="#b45309" />
        <rect x="0" y="16" width="425" height="14" fill="#b45309" />
        <text x="212" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. प्रेमचंद – 'मंत्र' (संवेदना बनाम अहंकार)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#92400e" font-weight="700">कथानक द्वंद्व:</text>
            <text x="75" y="14" fill="#1f2937">डॉ. चड्ढा का संवेदनहीन अभिजात्य vs बूढ़े भगत का निःस्वार्थ त्याग</text>

            <text x="0" y="34" fill="#92400e" font-weight="700">चरित्र वैषम्य:</text>
            <text x="75" y="34" fill="#4b5563">गोल्फ खेलने हेतु बीमार बालक को दुत्कारना vs आधी रात में शत्रु के पुत्र को बचाना</text>

            <text x="0" y="54" fill="#92400e" font-weight="700">मूल चेतना:</text>
            <text x="65" y="54" fill="#4b5563">धन और विज्ञान से बड़ी है मानवीय आत्मीयता एवं अंतरात्मा की आवाज</text>

            <rect x="0" y="70" width="397" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="198" y="88" fill="#b45309" font-size="10" font-weight="700" text-anchor="middle">चरमोत्कर्ष: डॉ. चड्ढा का आत्म-ग्लानि बोध</text>
            <text x="198" y="106" fill="#4b5563" font-size="9.5" text-anchor="middle">"मैं उस बूढ़े को खोजूंगा, उसके पैरों पर गिरकर अपने अपराध की क्षमा मांगूंगा!"</text>
            <text x="198" y="124" fill="#92400e" font-size="9" text-anchor="middle">मंत्र केवल सर्प-दंश का नहीं, बल्कि मृतप्राय मानवीय संवेदना को जगाने का महामंत्र है।</text>
        </g>
    </g>

    <!-- Story 2: Siddhartha Ka Lautna -->
    <g transform="translate(485, 108)" filter="url(#gCardSh)">
        <rect width="425" height="185" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
        <rect x="0" y="0" width="425" height="30" rx="10" fill="#047857" />
        <rect x="0" y="16" width="425" height="14" fill="#047857" />
        <text x="212" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. गंगा प्रसाद विमल – 'सिद्धार्थ का लौटना' (अस्तित्ववादी चिंतन)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#065f46" font-weight="700">कथा-प्रवृत्ति:</text>
            <text x="75" y="14" fill="#1f2937">अकहानी आंदोलन के प्रणेता; पौराणिक मिथक का आधुनिक जीवन-संदर्भ</text>

            <text x="0" y="34" fill="#065f46" font-weight="700">कथ्य धरातल:</text>
            <text x="75" y="34" fill="#4b5563">सत्य की खोज में गृह-त्याग (सिद्धार्थ) के पश्चात आधुनिक मनुष्य की वापसी</text>

            <text x="0" y="54" fill="#065f46" font-weight="700">आधुनिक द्वंद्व:</text>
            <text x="78" y="54" fill="#4b5563">महानगर का अकेलापन, पारिवारिक रिश्तों का क्षरण एवं संत्रास</text>

            <rect x="0" y="70" width="397" height="66" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="198" y="88" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">साहित्यिक निष्कर्ष: लौटना पराजय नहीं, यथार्थ स्वीकार है</text>
            <text x="198" y="106" fill="#4b5563" font-size="9.5" text-anchor="middle">निर्वाण और संन्यास की काल्पनिक ऊंचाइयों से उतरकर वास्तविक जीवन की</text>
            <text x="198" y="124" fill="#047857" font-size="9" text-anchor="middle">जटिलताओं और पारिवारिक उत्तरदायित्वों से जूझना ही सच्चा जीवन-साधना है।</text>
        </g>
    </g>

    <!-- SECTION B: NIBANDH (4 Columns) -->
    <text x="35" y="322" fill="#065f46" font-size="13.5" font-weight="800">खंड (ख) निबंध (Essays)</text>

    <!-- Essay 1: Shukla - Shraddha & Bhakti -->
    <g transform="translate(30, 335)" filter="url(#gCardSh)">
        <rect width="205" height="185" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="1.6" />
        <rect x="0" y="0" width="205" height="26" rx="8" fill="#1e40af" />
        <rect x="0" y="14" width="205" height="12" fill="#1e40af" />
        <text x="102" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">3. रामचंद्र शुक्ल: श्रद्धा और भक्ति</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#1e3a8a" font-weight="700">सूत्र:</text>
            <text x="25" y="12" fill="#1f2937">श्रद्धा + प्रेम = भक्ति</text>

            <text x="0" y="30" fill="#1e3a8a" font-weight="700">श्रद्धा:</text>
            <text x="32" y="30" fill="#4b5563">महत्व व सामाजिक गुण पर</text>

            <text x="0" y="48" fill="#1e3a8a" font-weight="700">प्रेम:</text>
            <text x="28" y="48" fill="#4b5563">व्यक्तिगत व सान्निध्य मूलक</text>

            <rect x="0" y="62" width="185" height="74" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
            <text x="92" y="78" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">मनोवैज्ञानिक विश्लेषण</text>
            <text x="92" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">श्रद्धा समाज का वह नैतिक संबल है</text>
            <text x="92" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">जिससे मनुष्य श्रेष्ठ गुणों की ओर</text>
            <text x="92" y="122" fill="#1e3a8a" font-size="8.5" font-weight="600" text-anchor="middle">स्वतः प्रेरित होता है।</text>
        </g>
    </g>

    <!-- Essay 2: Dwivedi - Urmila -->
    <g transform="translate(250, 335)" filter="url(#gCardSh)">
        <rect width="205" height="185" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.6" />
        <rect x="0" y="0" width="205" height="26" rx="8" fill="#9333ea" />
        <rect x="0" y="14" width="205" height="12" fill="#9333ea" />
        <text x="102" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">4. म.प्र. द्विवेदी: उर्मिला विषयक उदासीनता</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#6b21a8" font-weight="700">आक्षेप:</text>
            <text x="38" y="12" fill="#1f2937">प्राचीन कवियों की उपेक्षा</text>

            <text x="0" y="30" fill="#6b21a8" font-weight="700">विषय:</text>
            <text x="32" y="30" fill="#4b5563">उर्मिला का 14 वर्षीय मौन विरह</text>

            <text x="0" y="48" fill="#6b21a8" font-weight="700">प्रभाव:</text>
            <text x="35" y="48" fill="#4b5563">मैथिलीशरण गुप्त को प्रेरणा</text>

            <rect x="0" y="62" width="185" height="74" rx="5" fill="#faf5ff" stroke="#e9d5ff" />
            <text x="92" y="78" fill="#7e22ce" font-size="9" font-weight="700" text-anchor="middle">'साकेत' महाकाव्य की नींव</text>
            <text x="92" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">सीता के त्याग को सबने पूजा किंतु</text>
            <text x="92" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">उर्मिला के अवर्णनीय तप को</text>
            <text x="92" y="122" fill="#6b21a8" font-size="8.5" font-weight="600" text-anchor="middle">इतिहास ने भुला दिया था।</text>
        </g>
    </g>

    <!-- Essay 3: Parsai - Sadachar Ka Tabeez -->
    <g transform="translate(470, 335)" filter="url(#gCardSh)">
        <rect width="215" height="185" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6" />
        <rect x="0" y="0" width="215" height="26" rx="8" fill="#b91c1c" />
        <rect x="0" y="14" width="215" height="12" fill="#b91c1c" />
        <text x="107" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">5. हरिशंकर परसाई: सदाचार का ताबीज</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#991b1b" font-weight="700">विधा:</text>
            <text x="28" y="12" fill="#1f2937">तीक्ष्ण राजनीतिक-सामाजिक व्यंग्य</text>

            <text x="0" y="30" fill="#991b1b" font-weight="700">कटाक्ष:</text>
            <text x="35" y="30" fill="#4b5563">भ्रष्टाचार उन्मूलन के ढकोसले</text>

            <text x="0" y="48" fill="#991b1b" font-weight="700">प्रतीक:</text>
            <text x="35" y="48" fill="#4b5563">ताबीज से सदाचार लाने का भ्रम</text>

            <rect x="0" y="62" width="195" height="74" rx="5" fill="#fef2f2" stroke="#fca5a5" />
            <text x="97" y="78" fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle">व्यवस्थागत सच्चाई</text>
            <text x="97" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">31 तारीख को ताबीज से भी आवाज</text>
            <text x="97" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">आई: "अरे ले ले, आज 31 है!"</text>
            <text x="97" y="122" fill="#991b1b" font-size="8.5" font-weight="600" text-anchor="middle">दोष व्यवस्था में है, ताबीज में नहीं।</text>
        </g>
    </g>

    <!-- Essay 4: Mishra - Manoyog -->
    <g transform="translate(700, 335)" filter="url(#gCardSh)">
        <rect width="210" height="185" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6" />
        <rect x="0" y="0" width="210" height="26" rx="8" fill="#047857" />
        <rect x="0" y="14" width="210" height="12" fill="#047857" />
        <text x="105" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">6. प्रताप नारायण मिश्र: मनोयोग</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#065f46" font-weight="700">युग:</text>
            <text x="25" y="12" fill="#1f2937">भारतेंदु युगीन ललित निबंध</text>

            <text x="0" y="30" fill="#065f46" font-weight="700">विषय:</text>
            <text x="32" y="30" fill="#4b5563">मन की एकाग्रता व आत्म-संयम</text>

            <text x="0" y="48" fill="#065f46" font-weight="700">शैली:</text>
            <text x="32" y="48" fill="#4b5563">विनोदप्रिय, मुहावरेदार ठेठ भाषा</text>

            <rect x="0" y="62" width="190" height="74" rx="5" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="95" y="78" fill="#047857" font-size="9" font-weight="700" text-anchor="middle">सफलता का मूल मंत्र</text>
            <text x="95" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">जब तक किसी कार्य में मन का योग</text>
            <text x="95" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">नहीं होता, तब तक न विद्या फलती है</text>
            <text x="95" y="122" fill="#065f46" font-size="8.5" font-weight="600" text-anchor="middle">और न ही जीवन में सिद्धि मिलती है।</text>
        </g>
    </g>
</svg>
