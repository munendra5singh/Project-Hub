<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="100%" height="auto" style="font-family: 'Poppins', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="poetHdr" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#831843" />
            <stop offset="100%" stop-color="#9d174d" />
        </linearGradient>
        <filter id="pCardSh" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
        </filter>
    </defs>

    <rect width="940" height="520" rx="16" fill="#fffdfa" stroke="#fbcfe8" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="18" width="890" height="58" rx="10" fill="url(#poetHdr)" />
    <text x="470" y="42" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Unit 2: Comparative Framework of the Six Prescribed Hindi Poets</text>
    <text x="470" y="62" fill="#fce7f3" font-size="11.5" font-weight="500" text-anchor="middle">From Amir Khusro's Folk Riddles to Chhayavad, Halavad, Nationalist Verse, and Progressive Realism</text>

    <!-- 6 Cards Grid (2 rows x 3 columns) -->

    <!-- Poet 1: Amir Khusro -->
    <g transform="translate(30, 95)" filter="url(#pCardSh)">
        <rect width="280" height="190" rx="10" fill="#ffffff" stroke="#9d174d" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#9d174d" />
        <rect x="0" y="16" width="280" height="14" fill="#9d174d" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. Amir Khusro (Early Vernacular)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#831843" font-weight="700">Work:</text>
            <text x="42" y="14" fill="#1f2937">Mukariyān (Ed. Ghulam Samnani)</text>

            <text x="0" y="34" fill="#831843" font-weight="700">Prescribed:</text>
            <text x="68" y="34" fill="#4b5563">Star, Shoe, Drum, Scorpion (4 Riddles)</text>

            <text x="0" y="54" fill="#831843" font-weight="700">Motif:</text>
            <text x="40" y="54" fill="#4b5563">Folk entertainment, wit, playful denial</text>

            <text x="0" y="74" fill="#831843" font-weight="700">Linguistic:</text>
            <text x="62" y="74" fill="#4b5563">Proto-Khari Boli / Dehlavi vernacular</text>

            <rect x="0" y="88" width="252" height="48" rx="6" fill="#fdf2f8" stroke="#fbcfe8" />
            <text x="126" y="106" fill="#9d174d" font-size="9.5" font-weight="600" text-anchor="middle">Refrain: 'O friend, is it lover? No, a star!'</text>
            <text x="126" y="122" fill="#4b5563" font-size="9" text-anchor="middle">Subverts romantic expectations with witty objects</text>
        </g>
    </g>

    <!-- Poet 2: Jayashankar Prasad -->
    <g transform="translate(330, 95)" filter="url(#pCardSh)">
        <rect width="280" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#1e40af" />
        <rect x="0" y="16" width="280" height="14" fill="#1e40af" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. Jayashankar Prasad (Chhayavad)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#1e3a8a" font-weight="700">Work:</text>
            <text x="42" y="14" fill="#1f2937">'Aansu' (Initial 5 Stanzas)</text>

            <text x="0" y="34" fill="#1e3a8a" font-weight="700">Genre:</text>
            <text x="48" y="34" fill="#4b5563">Sublime elegiac &amp; memory lyric</text>

            <text x="0" y="54" fill="#1e3a8a" font-weight="700">Movement:</text>
            <text x="68" y="54" fill="#4b5563">Romantic-Mystic Chhayavad leader</text>

            <text x="0" y="74" fill="#1e3a8a" font-weight="700">Diction:</text>
            <text x="48" y="74" fill="#4b5563">Sanskritized Tatsam poetic Khari Boli</text>

            <rect x="0" y="88" width="252" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
            <text x="126" y="106" fill="#1e40af" font-size="9.5" font-weight="600" text-anchor="middle">'The densified anguish... now rains as tears'</text>
            <text x="126" y="122" fill="#4b5563" font-size="9" text-anchor="middle">Elevates personal grief into universal compassion</text>
        </g>
    </g>

    <!-- Poet 3: Harivansh Rai Bachchan -->
    <g transform="translate(630, 95)" filter="url(#pCardSh)">
        <rect width="280" height="190" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#b45309" />
        <rect x="0" y="16" width="280" height="14" fill="#b45309" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. H.R. Bachchan (Halavad)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#b45309" font-weight="700">Work:</text>
            <text x="42" y="14" fill="#1f2937">'Madhushala' (Initial 5 Stanzas)</text>

            <text x="0" y="34" fill="#b45309" font-weight="700">Philosophy:</text>
            <text x="75" y="34" fill="#4b5563">Halavad (Omar Khayyam inspiration)</text>

            <text x="0" y="54" fill="#b45309" font-weight="700">Allegory:</text>
            <text x="60" y="54" fill="#4b5563">Tavern = Life, Cup = Body, Wine = Bliss</text>

            <text x="0" y="74" fill="#b45309" font-weight="700">Social Idea:</text>
            <text x="70" y="74" fill="#4b5563">Transcending communal bigotry</text>

            <rect x="0" y="88" width="252" height="48" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="126" y="106" fill="#b45309" font-size="9.5" font-weight="600" text-anchor="middle">'Temple &amp; mosque divide; Tavern unites'</text>
            <text x="126" y="122" fill="#4b5563" font-size="9" text-anchor="middle">Rhythmic, musical quatrains celebrating humanism</text>
        </g>
    </g>

    <!-- Poet 4: Ramdhari Singh Dinkar -->
    <g transform="translate(30, 305)" filter="url(#pCardSh)">
        <rect width="280" height="195" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#991b1b" />
        <rect x="0" y="16" width="280" height="14" fill="#991b1b" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. Ramdhari Singh Dinkar (National Poet)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#991b1b" font-weight="700">Poem:</text>
            <text x="42" y="14" fill="#1f2937">'Mere Nagpati Mere Vishal'</text>

            <text x="0" y="34" fill="#991b1b" font-weight="700">Central Motif:</text>
            <text x="80" y="34" fill="#4b5563">The Himalayas as India's crown &amp; soul</text>

            <text x="0" y="54" fill="#991b1b" font-weight="700">Poetic Rasa:</text>
            <text x="75" y="54" fill="#4b5563">Veer Rasa (Heroic), Ojas energy</text>

            <text x="0" y="74" fill="#991b1b" font-weight="700">National Call:</text>
            <text x="82" y="74" fill="#4b5563">Awakening valor against colonial slumber</text>

            <rect x="0" y="88" width="252" height="52" rx="6" fill="#fef2f2" stroke="#fca5a5" />
            <text x="126" y="106" fill="#991b1b" font-size="9.5" font-weight="600" text-anchor="middle">'O Monarch of Mountains! O Colossus!'</text>
            <text x="126" y="124" fill="#4b5563" font-size="9" text-anchor="middle">Symbol of timeless cultural sovereignty &amp; resolve</text>
        </g>
    </g>

    <!-- Poet 5: Suryakant Tripathi Nirala -->
    <g transform="translate(330, 305)" filter="url(#pCardSh)">
        <rect width="280" height="195" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#047857" />
        <rect x="0" y="16" width="280" height="14" fill="#047857" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5. Nirala (Mahapran / Radical Lyricist)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#065f46" font-weight="700">Poem:</text>
            <text x="42" y="14" fill="#1f2937">'Bandho Na Naav Is Thanw Bandhu'</text>

            <text x="0" y="34" fill="#065f46" font-weight="700">Tone:</text>
            <text x="38" y="34" fill="#4b5563">Tender elegiac lyric of memory and love</text>

            <text x="0" y="54" fill="#065f46" font-weight="700">Symbols:</text>
            <text x="56" y="54" fill="#4b5563">Boat = Wandering Soul, Ghat = Sacred past</text>

            <text x="0" y="74" fill="#065f46" font-weight="700">Musicality:</text>
            <text x="68" y="74" fill="#4b5563">Haunting folk rhythm and emotional depth</text>

            <rect x="0" y="88" width="252" height="52" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="126" y="106" fill="#047857" font-size="9.5" font-weight="600" text-anchor="middle">'Do not moor the boat at this bank, brother!'</text>
            <text x="126" y="124" fill="#4b5563" font-size="9" text-anchor="middle">Mourns lost companionship with piercing subtlety</text>
        </g>
    </g>

    <!-- Poet 6: Nagarjun -->
    <g transform="translate(630, 305)" filter="url(#pCardSh)">
        <rect width="280" height="195" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8" />
        <rect x="0" y="0" width="280" height="30" rx="10" fill="#4338ca" />
        <rect x="0" y="16" width="280" height="14" fill="#4338ca" />
        <text x="140" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6. Nagarjun (The People's Bard)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#3730a3" font-weight="700">Poem:</text>
            <text x="42" y="14" fill="#1f2937">'Bahut Dinon Tak Choolha Roya'</text>

            <text x="0" y="34" fill="#3730a3" font-weight="700">Movement:</text>
            <text x="72" y="34" fill="#4b5563">Progressive Social Realism (Pragativad)</text>

            <text x="0" y="54" fill="#3730a3" font-weight="700">Contrast:</text>
            <text x="56" y="54" fill="#4b5563">Stark tragedy of famine vs Joy of grain</text>

            <text x="0" y="74" fill="#3730a3" font-weight="700">Images:</text>
            <text x="48" y="74" fill="#4b5563">Weeping hearth, one-eyed dog, joyful crow</text>

            <rect x="0" y="88" width="252" height="52" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
            <text x="126" y="106" fill="#4338ca" font-size="9.5" font-weight="600" text-anchor="middle">'Grains arrived inside the house after days'</text>
            <text x="126" y="124" fill="#4b5563" font-size="9" text-anchor="middle">Masterpiece of hunger, subaltern dignity &amp; revival</text>
        </g>
    </g>
</svg>
