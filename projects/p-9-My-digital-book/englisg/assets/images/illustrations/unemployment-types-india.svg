<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" height="100%">
  <defs>
    <filter id="unempShadowEn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="430" fill="#f8fafc" rx="12"/>

  <text x="410" y="34" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Major Types of Unemployment in the Indian Economy
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b">
    Structural Diagnostic: Disguised Rural Underemployment, Skills Mismatch &amp; Seasonal Fluctuations
  </text>

  <!-- 1. Disguised Unemployment -->
  <g transform="translate(40, 80)" filter="url(#unempShadowEn)">
    <rect width="345" height="135" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#ea580c"/>
    <rect y="24" width="345" height="8" fill="#ea580c"/>
    <text x="15" y="22" font-family="'Poppins', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      1. Disguised Unemployment (Underemployment)
    </text>

    <g transform="translate(15, 45)" font-family="'Poppins', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#c2410c">Dominant Sector: Agriculture &amp; Rural Farms</text>
      <text y="35">• 6 workers cultivate a plot where only 3 are needed.</text>
      <text y="55">• Marginal productivity of surplus labor is zero (MP_L = 0).</text>
      <text y="75" fill="#64748b">Withdrawing them leaves total output entirely unchanged.</text>
    </g>
  </g>

  <!-- 2. Structural Unemployment -->
  <g transform="translate(435, 80)" filter="url(#unempShadowEn)">
    <rect width="345" height="135" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#1e3a8a"/>
    <rect y="24" width="345" height="8" fill="#1e3a8a"/>
    <text x="15" y="22" font-family="'Poppins', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      2. Structural Unemployment
    </text>

    <g transform="translate(15, 45)" font-family="'Poppins', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#1e40af">Root Cause: Acute Skills Mismatch</text>
      <text y="35">• Modern industries demand specialized digital &amp; tech skills.</text>
      <text y="55">• Academic degrees focus on rote theory, not practical ability.</text>
      <text y="75" fill="#64748b">Vacancies exist side-by-side with large numbers of applicants.</text>
    </g>
  </g>

  <!-- 3. Seasonal Unemployment -->
  <g transform="translate(40, 230)" filter="url(#unempShadowEn)">
    <rect width="345" height="130" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#047857"/>
    <rect y="24" width="345" height="8" fill="#047857"/>
    <text x="15" y="22" font-family="'Poppins', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      3. Seasonal Unemployment
    </text>

    <g transform="translate(15, 45)" font-family="'Poppins', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#065f46">Sectors: Agriculture, Agro-Processing &amp; Tourism</text>
      <text y="35">• Full employment during sowing and harvesting peaks.</text>
      <text y="55">• Workers remain idle for 4 to 6 months off-season.</text>
      <text y="72" fill="#64748b">Policy Counter: MGNREGA off-season public works safety net.</text>
    </g>
  </g>

  <!-- 4. Open Unemployment -->
  <g transform="translate(435, 230)" filter="url(#unempShadowEn)">
    <rect width="345" height="130" rx="8" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect width="345" height="32" rx="8" fill="#6d28d9"/>
    <rect y="24" width="345" height="8" fill="#6d28d9"/>
    <text x="15" y="22" font-family="'Poppins', sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">
      4. Open / Educated Unemployment
    </text>

    <g transform="translate(15, 45)" font-family="'Poppins', sans-serif" font-size="11.5" fill="#334155">
      <text y="15" font-weight="600" fill="#5b21b6">Manifestation: Idle Willing Workers</text>
      <text y="35">• Jobseekers willing and able to work at going wage rates.</text>
      <text y="55">• Economy unable to generate sufficient formal jobs.</text>
      <text y="72" fill="#64748b">Highly prevalent among educated urban graduates.</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 375)">
    <rect width="740" height="42" rx="8" fill="#1e293b"/>
    <text x="370" y="26" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#f8fafc">
      Policy Enablers: MGNREGA (100 days guarantee), Skill India, PM Mudra Yojana &amp; PLI Manufacturing Incentives
    </text>
  </g>
</svg>
