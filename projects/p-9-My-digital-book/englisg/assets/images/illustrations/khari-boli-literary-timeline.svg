<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="auto" style="font-family: 'Poppins', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#991b1b" />
            <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>
        <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
        </filter>
        <marker id="timelineArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#b91c1c" />
        </marker>
    </defs>

    <rect width="920" height="480" rx="16" fill="#fffdfa" stroke="#fecaca" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="18" width="870" height="58" rx="10" fill="url(#hdrGrad)" />
    <text x="460" y="42" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Historical Timeline: The Evolution of Literary Khari Boli</text>
    <text x="460" y="62" fill="#fecaca" font-size="11.5" font-weight="500" text-anchor="middle">From the Four Fort William Pioneers to Modern Standard Hindi (1800 CE to Present)</text>

    <!-- Timeline Central Line -->
    <line x1="60" y1="105" x2="860" y2="105" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="105" x2="850" y2="105" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />

    <!-- Milestones Nodes on Line -->
    <circle cx="140" cy="105" r="14" fill="#991b1b" stroke="#ffffff" stroke-width="3" />
    <text x="140" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">1</text>

    <circle cx="360" cy="105" r="14" fill="#d97706" stroke="#ffffff" stroke-width="3" />
    <text x="360" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text>

    <circle cx="580" cy="105" r="14" fill="#047857" stroke="#ffffff" stroke-width="3" />
    <text x="580" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">3</text>

    <circle cx="800" cy="105" r="14" fill="#1e3a8a" stroke="#ffffff" stroke-width="3" />
    <text x="800" y="110" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">4</text>

    <!-- Phase 1: Early Pioneers -->
    <g transform="translate(30, 135)" filter="url(#shadowBox)">
        <rect width="220" height="320" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
        <rect x="0" y="0" width="220" height="34" rx="10" fill="#991b1b" />
        <rect x="0" y="20" width="220" height="14" fill="#991b1b" />
        <text x="110" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. Early Prose Pioneers</text>
        <rect x="50" y="38" width="120" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5" />
        <text x="110" y="52" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">Fort William Era (1800)</text>

        <g transform="translate(14, 70)" font-size="10.5">
            <text x="0" y="16" fill="#7f1d1d" font-weight="700">• Insha Allah Khan</text>
            <text x="10" y="32" fill="#4b5563">Work: 'Rani Ketki Ki Kahani'</text>
            <text x="10" y="46" fill="#6b7280" font-size="9.5">(Pure indigenous idiom)</text>

            <text x="0" y="74" fill="#7f1d1d" font-weight="700">• Lallu Lal</text>
            <text x="10" y="90" fill="#4b5563">Work: 'Prem Sagar' (Braj-tinted)</text>

            <text x="0" y="118" fill="#7f1d1d" font-weight="700">• Sadal Mishra</text>
            <text x="10" y="134" fill="#4b5563">Work: 'Nasiketopakhyan'</text>

            <text x="0" y="162" fill="#7f1d1d" font-weight="700">• Munshi Sadasukhlal</text>
            <text x="10" y="178" fill="#4b5563">Work: 'Sukhsagar' (Sanskritized)</text>

            <rect x="0" y="200" width="192" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" />
            <text x="96" y="216" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">Significance: Provided the</text>
            <text x="96" y="229" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">initial foundation for prose.</text>
        </g>
    </g>

    <!-- Phase 2: Bharatendu Era -->
    <g transform="translate(260, 135)" filter="url(#shadowBox)">
        <rect width="210" height="320" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" />
        <rect x="0" y="0" width="210" height="34" rx="10" fill="#d97706" />
        <rect x="0" y="20" width="210" height="14" fill="#d97706" />
        <text x="105" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. Bharatendu Era (1857-1900)</text>
        <rect x="45" y="38" width="120" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" />
        <text x="105" y="52" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">Renaissance Awakening</text>

        <g transform="translate(14, 70)" font-size="10.5">
            <text x="0" y="16" fill="#92400e" font-weight="700">• Bharatendu Harishchandra</text>
            <text x="10" y="32" fill="#4b5563">Established standard prose</text>
            <text x="10" y="46" fill="#6b7280" font-size="9.5">Plays: 'Bharat Durdasha'</text>

            <text x="0" y="74" fill="#92400e" font-weight="700">• Literary Journalism</text>
            <text x="10" y="90" fill="#4b5563">'Kavivachan Sudha' journal</text>
            <text x="10" y="104" fill="#6b7280" font-size="9.5">'Brahman' (Pratap Narayan Mishra)</text>

            <text x="0" y="132" fill="#92400e" font-weight="700">• Dual Language State</text>
            <text x="10" y="148" fill="#4b5563">Prose: Khari Boli triumphs</text>
            <text x="10" y="164" fill="#4b5563">Poetry: Braj Bhasha lingers</text>

            <rect x="0" y="200" width="182" height="36" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="91" y="216" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">Motto: Development of one's</text>
            <text x="91" y="229" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">own tongue is root of all progress.</text>
        </g>
    </g>

    <!-- Phase 3: Dwivedi Era -->
    <g transform="translate(480, 135)" filter="url(#shadowBox)">
        <rect width="210" height="320" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2" />
        <rect x="0" y="0" width="210" height="34" rx="10" fill="#047857" />
        <rect x="0" y="20" width="210" height="14" fill="#047857" />
        <text x="105" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. Dwivedi Era (1900-1920)</text>
        <rect x="45" y="38" width="120" height="20" rx="10" fill="#ecfdf5" stroke="#a7f3d0" />
        <text x="105" y="52" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">Discipline &amp; Standardization</text>

        <g transform="translate(14, 70)" font-size="10.5">
            <text x="0" y="16" fill="#065f46" font-weight="700">• Mahavir Prasad Dwivedi</text>
            <text x="10" y="32" fill="#4b5563">Editor of 'Saraswati' (from 1903)</text>
            <text x="10" y="46" fill="#6b7280" font-size="9.5">Grammatical rigor &amp; orthography</text>

            <text x="0" y="74" fill="#065f46" font-weight="700">• Khari Boli in Poetry</text>
            <text x="10" y="90" fill="#4b5563">Braj Bhasha phased out</text>
            <text x="10" y="104" fill="#6b7280" font-size="9.5">Khari Boli crowned as poetic voice</text>

            <text x="0" y="132" fill="#065f46" font-weight="700">• Landmark Epics</text>
            <text x="10" y="148" fill="#4b5563">Gupt: 'Bharat Bharati'</text>
            <text x="10" y="164" fill="#4b5563">Hariaudh: 'Priya Pravas'</text>

            <rect x="0" y="200" width="182" height="36" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="91" y="216" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">Triumph: Khari Boli becomes sole</text>
            <text x="91" y="229" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">medium for both prose &amp; verse.</text>
        </g>
    </g>

    <!-- Phase 4: Chhayavad & Modern -->
    <g transform="translate(700, 135)" filter="url(#shadowBox)">
        <rect width="190" height="320" rx="10" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" />
        <rect x="0" y="0" width="190" height="34" rx="10" fill="#1e3a8a" />
        <rect x="0" y="20" width="190" height="14" fill="#1e3a8a" />
        <text x="95" y="22" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. Chhayavad &amp; Beyond</text>
        <rect x="40" y="38" width="110" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
        <text x="95" y="52" fill="#1e40af" font-size="9.5" font-weight="700" text-anchor="middle">Zenith of Expression</text>

        <g transform="translate(12, 70)" font-size="10.5">
            <text x="0" y="16" fill="#1e3a8a" font-weight="700">• Chhayavadi Quartet</text>
            <text x="10" y="32" fill="#4b5563">Prasad, Nirala, Pant,</text>
            <text x="10" y="46" fill="#4b5563">Mahadevi Varma</text>

            <text x="0" y="74" fill="#1e3a8a" font-weight="700">• Fiction &amp; Criticism</text>
            <text x="10" y="90" fill="#4b5563">Premchand (Master of Realism)</text>
            <text x="10" y="104" fill="#4b5563">Ramchandra Shukla</text>

            <text x="0" y="132" fill="#1e3a8a" font-weight="700">• Progressive &amp; Modern</text>
            <text x="10" y="148" fill="#4b5563">Dinkar, Bachchan, Nagarjun,</text>
            <text x="10" y="164" fill="#4b5563">Agyeya, Muktibodh</text>

            <rect x="0" y="200" width="166" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
            <text x="83" y="216" fill="#1e3a8a" font-size="9.5" font-weight="700" text-anchor="middle">Constitutional Mandate: Adopted</text>
            <text x="83" y="229" fill="#1e3a8a" font-size="9.5" font-weight="700" text-anchor="middle">as Union Official Lang in 1949.</text>
        </g>
    </g>
</svg>
