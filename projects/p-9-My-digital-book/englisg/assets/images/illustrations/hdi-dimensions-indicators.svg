<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <linearGradient id="healthGradEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="eduGradEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="incomeGradEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="hdiGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="hdiCardShadowEn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="820" height="440" fill="#f8fafc" rx="12"/>

  <text x="410" y="34" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Human Development Index (HDI) Architecture
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b">
    Developed by the United Nations Development Programme (UNDP) in 1990 by Mahbub ul Haq &amp; Amartya Sen
  </text>

  <text x="410" y="90" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">
    THREE ESSENTIAL DIMENSIONS
  </text>

  <!-- Column 1: Health -->
  <g transform="translate(40, 105)" filter="url(#hdiCardShadowEn)">
    <rect width="226" height="60" rx="8" fill="url(#healthGradEn)"/>
    <text x="113" y="36" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Long &amp; Healthy Life</text>

    <line x1="113" y1="60" x2="113" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

    <rect y="85" width="226" height="90" rx="8" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/>
    <text x="113" y="110" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#dc2626">Indicator</text>
    <text x="113" y="136" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#1e293b">Life Expectancy at Birth</text>
    <text x="113" y="154" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#64748b">(Min: 20 yrs, Max: 85 yrs)</text>

    <rect y="185" width="226" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="113" y="208" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#991b1b">Life Expectancy Index</text>
  </g>

  <!-- Column 2: Education -->
  <g transform="translate(296, 105)" filter="url(#hdiCardShadowEn)">
    <rect width="228" height="60" rx="8" fill="url(#eduGradEn)"/>
    <text x="114" y="36" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Knowledge</text>

    <line x1="114" y1="60" x2="114" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

    <rect y="85" width="228" height="90" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="114" y="108" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#2563eb">Two Indicators</text>
    <text x="114" y="128" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">1. Expected Years of Schooling</text>
    <text x="114" y="148" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">2. Mean Years of Schooling</text>

    <rect y="185" width="228" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="114" y="208" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#1e40af">Education Index</text>
  </g>

  <!-- Column 3: Decent Standard of Living -->
  <g transform="translate(554, 105)" filter="url(#hdiCardShadowEn)">
    <rect width="226" height="60" rx="8" fill="url(#incomeGradEn)"/>
    <text x="113" y="36" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Decent Standard of Living</text>

    <line x1="113" y1="60" x2="113" y2="85" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>

    <rect y="85" width="226" height="90" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="113" y="110" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#059669">Indicator</text>
    <text x="113" y="136" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#1e293b">GNI Per Capita (PPP $)</text>
    <text x="113" y="154" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" fill="#64748b">(Logarithmic Scale)</text>

    <rect y="185" width="226" height="36" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="113" y="208" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#065f46">GNI Index</text>
  </g>

  <path d="M153 336 L153 355 L410 355 M410 336 L410 355 M667 336 L667 355 L410 355" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="410,366 405,356 415,356" fill="#94a3b8"/>

  <g transform="translate(100, 370)" filter="url(#hdiCardShadowEn)">
    <rect width="620" height="52" rx="10" fill="url(#hdiGradEn)"/>
    <text x="310" y="24" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      HDI = ∛ ( I_Life × I_Education × I_Income )
    </text>
    <text x="310" y="42" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11.5" fill="#e0e7ff">
      Geometric Mean of the Three Dimensional Indices • Scale Range: 0 to 1
    </text>
  </g>
</svg>
