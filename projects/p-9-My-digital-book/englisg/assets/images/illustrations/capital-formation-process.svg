<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stage1GradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stage2GradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="stage3GradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="capShadowEn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="420" fill="#f8fafc" rx="12"/>

  <text x="410" y="34" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    The 3-Stage Process of Capital Formation
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b">
    The Core Engine of Economic Growth (Arthur Lewis &amp; Ragnar Nurkse): Savings $\to$ Mobilization $\to$ Productive Investment
  </text>

  <!-- Stage 1 -->
  <g transform="translate(40, 85)" filter="url(#capShadowEn)">
    <rect width="216" height="230" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="216" height="46" rx="10" fill="url(#stage1GradEn)"/>
    <rect y="36" width="216" height="10" fill="url(#stage1GradEn)"/>
    <text x="108" y="28" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      Stage 1: Creation of Savings
    </text>

    <g transform="translate(14, 65)" font-family="'Poppins', sans-serif" font-size="12" fill="#334155">
      <text y="15" font-weight="700" fill="#1e40af">Primary Sources:</text>
      <text y="35">• Household personal savings</text>
      <text y="55">• Retained corporate profits</text>
      <text y="75">• Public budgetary surpluses</text>
      <text y="105" font-weight="700" fill="#1e40af">Key Determinants:</text>
      <text y="125">• Capacity to save (Income level)</text>
      <text y="145">• Willingness to save (Interest/safety)</text>
    </g>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(262, 185)">
    <circle cx="16" cy="15" r="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M8 15 L24 15 M18 9 L24 15 L18 21" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(300, 85)" filter="url(#capShadowEn)">
    <rect width="220" height="230" rx="10" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect width="220" height="46" rx="10" fill="url(#stage2GradEn)"/>
    <rect y="36" width="220" height="10" fill="url(#stage2GradEn)"/>
    <text x="110" y="28" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      Stage 2: Mobilization of Savings
    </text>

    <g transform="translate(14, 65)" font-family="'Poppins', sans-serif" font-size="12" fill="#334155">
      <text y="15" font-weight="700" fill="#6d28d9">Financial Intermediaries:</text>
      <text y="35">• Commercial banks &amp; Post offices</text>
      <text y="55">• Capital markets (Equities &amp; Bonds)</text>
      <text y="75">• Mutual funds &amp; Pension assets</text>
      <text y="105" font-weight="700" fill="#6d28d9">Core Role:</text>
      <text y="125">• Channel idle hoardings into credit</text>
      <text y="145">• Broad-based financial inclusion</text>
    </g>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(526, 185)">
    <circle cx="16" cy="15" r="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M8 15 L24 15 M18 9 L24 15 L18 21" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(564, 85)" filter="url(#capShadowEn)">
    <rect width="216" height="230" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="216" height="46" rx="10" fill="url(#stage3GradEn)"/>
    <rect y="36" width="216" height="10" fill="url(#stage3GradEn)"/>
    <text x="108" y="28" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      Stage 3: Real Investment
    </text>

    <g transform="translate(14, 65)" font-family="'Poppins', sans-serif" font-size="12" fill="#334155">
      <text y="15" font-weight="700" fill="#047857">Capital Assets Created:</text>
      <text y="35">• Physical capital: Factories, plants</text>
      <text y="55">• Infrastructure: Roads, ports, grid</text>
      <text y="75">• Human capital: Education &amp; Skills</text>
      <text y="105" font-weight="700" fill="#047857">Macro Outcome:</text>
      <text y="125">• Expands national production frontier</text>
      <text y="145">• Generates quality employment</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 335)">
    <rect width="740" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="370" y="26" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      Virtuous Growth Spiral:
    </text>
    <text x="370" y="47" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#475569">
      Capital Formation $\to$ Higher Productivity $\to$ Higher GDP &amp; Employment $\to$ Rising Incomes $\to$ Further Savings &amp; Investment
    </text>
  </g>
</svg>
