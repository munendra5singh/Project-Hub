<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%">
  <defs>
    <filter id="demoShadowEn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="440" fill="#f8fafc" rx="12"/>

  <text x="410" y="34" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    India's Demographic Dividend &amp; Age Cohort Structure
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b">
    Working-Age Bulge (15-59 Years) &amp; Declining Dependency Ratio — The 2020–2055 Window of Opportunity
  </text>

  <!-- Left: Demographic Structure Breakdown -->
  <g transform="translate(40, 85)" filter="url(#demoShadowEn)">
    <rect width="360" height="260" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="360" height="42" rx="10" fill="#1e293b"/>
    <text x="180" y="27" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      Age Cohort Population Distribution
    </text>

    <!-- 60+ Elderly -->
    <g transform="translate(20, 60)">
      <rect width="320" height="45" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="15" y="28" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#dc2626">Elderly Cohort (60+ yrs): ~10%</text>
      <text x="305" y="28" text-anchor="end" font-family="'Poppins', sans-serif" font-size="11" fill="#7f1d1d">Dependents</text>
    </g>

    <!-- 15-59 Working Class -->
    <g transform="translate(20, 115)">
      <rect width="320" height="75" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
      <text x="15" y="30" font-family="'Poppins', sans-serif" font-size="15" font-weight="800" fill="#047857">Working-Age Cohort (15-59 yrs): ~65-68%</text>
      <text x="15" y="52" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#065f46">★ Engine of the Demographic Dividend</text>
      <text x="305" y="68" text-anchor="end" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#047857">Median Age: ~28.5 yrs</text>
    </g>

    <!-- 0-14 Children -->
    <g transform="translate(20, 200)">
      <rect width="320" height="45" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="15" y="28" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#c2410c">Youth Cohort (0-14 yrs): ~24%</text>
      <text x="305" y="28" text-anchor="end" font-family="'Poppins', sans-serif" font-size="11" fill="#9a3412">Future Workforce</text>
    </g>
  </g>

  <!-- Right: 4 Policy Pillars -->
  <g transform="translate(425, 85)" filter="url(#demoShadowEn)">
    <rect width="355" height="260" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="355" height="42" rx="10" fill="#1e3a8a"/>
    <text x="177" y="27" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="14" font-weight="700" fill="#ffffff">
      4 Pillars to Unlock Economic Potential
    </text>

    <g transform="translate(20, 60)" font-family="'Poppins', sans-serif" font-size="12.5" fill="#1e293b">
      <circle cx="8" cy="12" r="5" fill="#2563eb"/>
      <text x="24" y="16" font-weight="700">1. Quality Education &amp; Skills:</text>
      <text x="24" y="34" fill="#64748b">Skill India, NEP 2020 vocationalization, STEM focus</text>

      <circle cx="8" cy="62" r="5" fill="#2563eb"/>
      <text x="24" y="66" font-weight="700">2. High-Productivity Job Creation:</text>
      <text x="24" y="84" fill="#64748b">Manufacturing (PLI schemes), Startups, MSME clusters</text>

      <circle cx="8" cy="112" r="5" fill="#2563eb"/>
      <text x="24" y="116" font-weight="700">3. Health &amp; Nutritional Security:</text>
      <text x="24" y="134" fill="#64748b">Ayushman Bharat, Poshan Abhiyaan, preventive care</text>

      <circle cx="8" cy="162" r="5" fill="#2563eb"/>
      <text x="24" y="166" font-weight="700">4. Female Labor Force Participation (FLFP):</text>
      <text x="24" y="184" fill="#64748b">Equal wage parity, maternity benefits, safe transit</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 365)">
    <rect width="740" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="370" y="24" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#0f172a">
      ⚠ Dividend vs Demographic Disaster:
    </text>
    <text x="370" y="42" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11.5" fill="#475569">
      Without high-quality skilling and productive job creation, this rare demographic gift risks turning into acute social friction.
    </text>
  </g>
</svg>
