<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%">
  <defs>
    <linearGradient id="growthGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="devGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardShadowEn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="420" fill="#f8fafc" rx="12"/>

  <text x="400" y="38" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Economic Growth vs Economic Development
  </text>
  <text x="400" y="60" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b">
    Theoretical Framework: The Transition from Means to the End Goal of Human Agency
  </text>

  <!-- Left Card: Economic Growth -->
  <g transform="translate(40, 85)" filter="url(#cardShadowEn)">
    <rect width="330" height="260" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="330" height="48" rx="10" fill="url(#growthGradEn)"/>
    <rect y="38" width="330" height="10" fill="url(#growthGradEn)"/>
    <text x="165" y="30" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Economic Growth
    </text>

    <g transform="translate(20, 75)" font-family="'Poppins', sans-serif" font-size="13" fill="#1e293b">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="20" y="10" font-weight="600">Nature: <tspan font-weight="400" fill="#475569">Quantitative &amp; Numerical</tspan></text>
      
      <circle cx="6" cy="36" r="4" fill="#3b82f6"/>
      <text x="20" y="40" font-weight="600">Metric: <tspan font-weight="400" fill="#475569">Real GDP, National &amp; Per Capita Income</tspan></text>

      <circle cx="6" cy="66" r="4" fill="#3b82f6"/>
      <text x="20" y="70" font-weight="600">Scope: <tspan font-weight="400" fill="#475569">Narrow (Physical output expansion)</tspan></text>

      <circle cx="6" cy="96" r="4" fill="#3b82f6"/>
      <text x="20" y="100" font-weight="600">Role: <tspan font-weight="400" fill="#475569">Serves as a </tspan><tspan font-weight="700" fill="#1e3a8a">Means</tspan><tspan font-weight="400" fill="#475569"> to an end</tspan></text>

      <circle cx="6" cy="126" r="4" fill="#3b82f6"/>
      <text x="20" y="130" font-weight="600">Example: <tspan font-weight="400" fill="#475569">7.2% annual growth in Indian GDP</tspan></text>
    </g>

    <rect x="20" y="215" width="290" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="165" y="235" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">
      Aggregate Output &amp; Production Expansion
    </text>
  </g>

  <!-- Central Bridge Arrow -->
  <g transform="translate(378, 200)">
    <circle cx="22" cy="10" r="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M12 10 L28 10 M22 4 L28 10 L22 16" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="48" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#64748b">Transformation</text>
  </g>

  <!-- Right Card: Economic Development -->
  <g transform="translate(430, 85)" filter="url(#cardShadowEn)">
    <rect width="330" height="260" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect width="330" height="48" rx="10" fill="url(#devGradEn)"/>
    <rect y="38" width="330" height="10" fill="url(#devGradEn)"/>
    <text x="165" y="30" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Economic Development
    </text>

    <g transform="translate(20, 75)" font-family="'Poppins', sans-serif" font-size="13" fill="#1e293b">
      <circle cx="6" cy="6" r="4" fill="#10b981"/>
      <text x="20" y="10" font-weight="600">Nature: <tspan font-weight="400" fill="#475569">Qualitative, Structural &amp; Institutional</tspan></text>
      
      <circle cx="6" cy="36" r="4" fill="#10b981"/>
      <text x="20" y="40" font-weight="600">Metric: <tspan font-weight="400" fill="#475569">Human Development Index (HDI), MPI</tspan></text>

      <circle cx="6" cy="66" r="4" fill="#10b981"/>
      <text x="20" y="70" font-weight="600">Scope: <tspan font-weight="400" fill="#475569">Broad (Health, Education, Dignity)</tspan></text>

      <circle cx="6" cy="96" r="4" fill="#10b981"/>
      <text x="20" y="100" font-weight="600">Role: <tspan font-weight="400" fill="#475569">The ultimate </tspan><tspan font-weight="700" fill="#047857">End Goal</tspan><tspan font-weight="400" fill="#475569"> of policy</tspan></text>

      <circle cx="6" cy="126" r="4" fill="#10b981"/>
      <text x="20" y="130" font-weight="600">Example: <tspan font-weight="400" fill="#475569">Poverty eradication, lower MMR, high literacy</tspan></text>
    </g>

    <rect x="20" y="215" width="290" height="30" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="165" y="235" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#047857">
      Expansion of Real Human Capabilities (Freedom)
    </text>
  </g>

  <!-- Bottom Synthesis Bar -->
  <g transform="translate(40, 360)">
    <rect width="720" height="42" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="360" y="26" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#334155">
      💡 Prof. Amartya Sen: <tspan font-weight="400" fill="#475569">"Development is about expanding human capability; growth is just one way to achieve it."</tspan>
    </text>
  </g>
</svg>
