<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="100%">
  <defs>
    <linearGradient id="planGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="nitiGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="planShadowEn" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="820" height="420" fill="#f8fafc" rx="12"/>

  <text x="410" y="34" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#0f172a">
    Evolution of Indian Economic Planning: Planning Commission to NITI Aayog
  </text>
  <text x="410" y="56" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b">
    From Top-Down Directive Planning to Participatory Cooperative Federalism
  </text>

  <!-- Left Card: Planning Commission -->
  <g transform="translate(40, 85)" filter="url(#planShadowEn)">
    <rect width="345" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="345" height="46" rx="10" fill="url(#planGradEn)"/>
    <rect y="36" width="345" height="10" fill="url(#planGradEn)"/>
    <text x="172" y="28" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      Planning Commission (1950 – 2014)
    </text>

    <g transform="translate(18, 65)" font-family="'Poppins', sans-serif" font-size="12" fill="#334155">
      <text y="15" font-weight="700" fill="#1e293b">• Paradigm Approach:</text>
      <text y="33" fill="#64748b">Centralized Top-Down directive allocation</text>

      <text y="60" font-weight="700" fill="#1e293b">• Time Horizon:</text>
      <text y="78" fill="#64748b">Fixed 5-Year Plans (12 Five-Year Plans completed)</text>

      <text y="105" font-weight="700" fill="#1e293b">• Relationship with States:</text>
      <text y="123" fill="#64748b">Uniform 'One Size Fits All' schematic blueprints</text>

      <text y="150" font-weight="700" fill="#1e293b">• Fiscal Role:</text>
      <text y="168" fill="#64748b">Discretionary power to sanction plan funds to state ministries</text>
    </g>
  </g>

  <!-- Transition Arrow -->
  <g transform="translate(390, 200)">
    <circle cx="20" cy="10" r="20" fill="#2563eb"/>
    <path d="M12 10 L26 10 M20 4 L26 10 L20 16" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="20" y="44" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#2563eb">Jan 1, 2015</text>
  </g>

  <!-- Right Card: NITI Aayog -->
  <g transform="translate(435, 85)" filter="url(#planShadowEn)">
    <rect width="345" height="260" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect width="345" height="46" rx="10" fill="url(#nitiGradEn)"/>
    <rect y="36" width="345" height="10" fill="url(#nitiGradEn)"/>
    <text x="172" y="28" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      NITI Aayog (2015 – Present)
    </text>

    <g transform="translate(18, 65)" font-family="'Poppins', sans-serif" font-size="12" fill="#334155">
      <text y="15" font-weight="700" fill="#1e3a8a">• Paradigm Approach:</text>
      <text y="33" fill="#475569">Bottom-Up Cooperative Federalism ('Team India')</text>

      <text y="60" font-weight="700" fill="#1e3a8a">• Time Horizon:</text>
      <text y="78" fill="#475569">15-Year Vision, 7-Year Strategy, 3-Year Action Agenda</text>

      <text y="105" font-weight="700" fill="#1e3a8a">• Relationship with States:</text>
      <text y="123" fill="#475569">Chief Ministers as equal voting members of Governing Council</text>

      <text y="150" font-weight="700" fill="#1e3a8a">• Core Function:</text>
      <text y="168" fill="#475569">Policy Think Tank: Evidence-based indexes (SDG, Innovation, ADP)</text>
    </g>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(40, 360)">
    <rect width="740" height="46" rx="8" fill="#1e293b"/>
    <text x="370" y="28" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">
      Core Tenet: 'Cooperative and Competitive Federalism' — exemplified by the Aspirational Districts Programme (ADP)
    </text>
  </g>
</svg>
