<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="auto" style="font-family: 'Poppins', -apple-system, sans-serif;">
    <defs>
        <linearGradient id="gadyaHdr" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#065f46" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <filter id="gCardSh" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08" />
        </filter>
    </defs>

    <rect width="940" height="540" rx="16" fill="#fffdfa" stroke="#d1fae5" stroke-width="2" />

    <!-- Title Bar -->
    <rect x="25" y="16" width="890" height="56" rx="10" fill="url(#gadyaHdr)" />
    <text x="470" y="39" fill="#ffffff" font-size="16.5" font-weight="700" text-anchor="middle">Unit 3: Thematic Matrix of Prescribed Prose Selections (Stories &amp; Essays)</text>
    <text x="470" y="58" fill="#a7f3d0" font-size="11" font-weight="500" text-anchor="middle">Section (A) 2 Masterpiece Stories &amp; Section (B) 4 Milestone Philosophical, Feminist, Satirical &amp; Reflexive Essays</text>

    <!-- SECTION A: STORIES -->
    <text x="35" y="96" fill="#065f46" font-size="13.5" font-weight="800">Section (A) Stories (Kahaniyan)</text>

    <!-- Story 1: Mantra -->
    <g transform="translate(30, 108)" filter="url(#gCardSh)">
        <rect width="425" height="185" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.8" />
        <rect x="0" y="0" width="425" height="30" rx="10" fill="#b45309" />
        <rect x="0" y="16" width="425" height="14" fill="#b45309" />
        <text x="212" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. Munshi Premchand – 'Mantra' (Compassion vs. Vanity)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#92400e" font-weight="700">Central Conflict:</text>
            <text x="95" y="14" fill="#1f2937">Dr. Chadha's callous elitism vs Old Bhagat's selfless duty</text>

            <text x="0" y="34" fill="#92400e" font-weight="700">Moral Turn:</text>
            <text x="75" y="34" fill="#4b5563">Refusing medical help for golf vs Saving enemy's dying son at midnight</text>

            <text x="0" y="54" fill="#92400e" font-weight="700">Core Message:</text>
            <text x="82" y="54" fill="#4b5563">The voice of conscience outweighs material wealth and pride</text>

            <rect x="0" y="70" width="397" height="66" rx="6" fill="#fffbeb" stroke="#fde68a" />
            <text x="198" y="88" fill="#b45309" font-size="10" font-weight="700" text-anchor="middle">Climax: Dr. Chadha's Profound Repentance</text>
            <text x="198" y="106" fill="#4b5563" font-size="9.5" text-anchor="middle">"I shall seek that old man and fall at his feet to beg forgiveness!"</text>
            <text x="198" y="124" fill="#92400e" font-size="9" text-anchor="middle">The true 'mantra' is the awakening of dormant human empathy.</text>
        </g>
    </g>

    <!-- Story 2: Siddhartha Ka Lautna -->
    <g transform="translate(485, 108)" filter="url(#gCardSh)">
        <rect width="425" height="185" rx="10" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
        <rect x="0" y="0" width="425" height="30" rx="10" fill="#047857" />
        <rect x="0" y="16" width="425" height="14" fill="#047857" />
        <text x="212" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. Ganga Prasad Vimal – 'Siddhartha Ka Lautna' (Existential Return)</text>

        <g transform="translate(14, 40)" font-size="10.5">
            <text x="0" y="14" fill="#065f46" font-weight="700">Movement:</text>
            <text x="68" y="14" fill="#1f2937">Leader of 'A-Kahani' (Anti-Story); Myth reframed in modern alienation</text>

            <text x="0" y="34" fill="#065f46" font-weight="700">Allegory:</text>
            <text x="56" y="34" fill="#4b5563">The ancient Buddha's renunciation contrasted with modern homecoming</text>

            <text x="0" y="54" fill="#065f46" font-weight="700">Themes:</text>
            <text x="52" y="54" fill="#4b5563">Urban loneliness, erosion of family bonds, psychological dread</text>

            <rect x="0" y="70" width="397" height="66" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="198" y="88" fill="#065f46" font-size="10" font-weight="700" text-anchor="middle">Literary Insight: The Return is Realization, Not Defeat</text>
            <text x="198" y="106" fill="#4b5563" font-size="9.5" text-anchor="middle">True transcendence lies not in escapist isolation, but in confronting</text>
            <text x="198" y="124" fill="#047857" font-size="9" text-anchor="middle">the complex responsibilities of lived everyday existence.</text>
        </g>
    </g>

    <!-- SECTION B: ESSAYS -->
    <text x="35" y="322" fill="#065f46" font-size="13.5" font-weight="800">Section (B) Essays (Nibandh)</text>

    <!-- Essay 1: Shukla -->
    <g transform="translate(30, 335)" filter="url(#gCardSh)">
        <rect width="205" height="185" rx="8" fill="#ffffff" stroke="#1e40af" stroke-width="1.6" />
        <rect x="0" y="0" width="205" height="26" rx="8" fill="#1e40af" />
        <rect x="0" y="14" width="205" height="12" fill="#1e40af" />
        <text x="102" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">3. Shukla: Shraddha aur Bhakti</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#1e3a8a" font-weight="700">Formula:</text>
            <text x="52" y="12" fill="#1f2937">Reverence + Love = Bhakti</text>

            <text x="0" y="30" fill="#1e3a8a" font-weight="700">Reverence:</text>
            <text x="62" y="30" fill="#4b5563">Social virtue &amp; moral worth</text>

            <text x="0" y="48" fill="#1e3a8a" font-weight="700">Love:</text>
            <text x="32" y="48" fill="#4b5563">Personal attachment &amp; proximity</text>

            <rect x="0" y="62" width="185" height="74" rx="5" fill="#eff6ff" stroke="#bfdbfe" />
            <text x="92" y="78" fill="#1e40af" font-size="9" font-weight="700" text-anchor="middle">Psychological Depth</text>
            <text x="92" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">Reverence is the moral glue that</text>
            <text x="92" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">inspires society toward nobility</text>
            <text x="92" y="122" fill="#1e40af" font-size="8.5" font-weight="600" text-anchor="middle">and ethical excellence.</text>
        </g>
    </g>

    <!-- Essay 2: Dwivedi -->
    <g transform="translate(250, 335)" filter="url(#gCardSh)">
        <rect width="205" height="185" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.6" />
        <rect x="0" y="0" width="205" height="26" rx="8" fill="#9333ea" />
        <rect x="0" y="14" width="205" height="12" fill="#9333ea" />
        <text x="102" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">4. Dwivedi: Neglect of Urmila</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#6b21a8" font-weight="700">Critique:</text>
            <text x="48" y="12" fill="#1f2937">Omission by ancient poets</text>

            <text x="0" y="30" fill="#6b21a8" font-weight="700">Subject:</text>
            <text x="45" y="30" fill="#4b5563">Urmila's 14-year silent sacrifice</text>

            <text x="0" y="48" fill="#6b21a8" font-weight="700">Legacy:</text>
            <text x="42" y="48" fill="#4b5563">Inspired Gupt's epic 'Saket'</text>

            <rect x="0" y="62" width="185" height="74" rx="5" fill="#faf5ff" stroke="#e9d5ff" />
            <text x="92" y="78" fill="#7e22ce" font-size="9" font-weight="700" text-anchor="middle">Feminist Rehabilitation</text>
            <text x="92" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">While Sita's trials were celebrated,</text>
            <text x="92" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">Urmila's solitary endurance was</text>
            <text x="92" y="122" fill="#6b21a8" font-size="8.5" font-weight="600" text-anchor="middle">unjustly left unchronicled.</text>
        </g>
    </g>

    <!-- Essay 3: Parsai -->
    <g transform="translate(470, 335)" filter="url(#gCardSh)">
        <rect width="215" height="185" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6" />
        <rect x="0" y="0" width="215" height="26" rx="8" fill="#b91c1c" />
        <rect x="0" y="14" width="215" height="12" fill="#b91c1c" />
        <text x="107" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">5. Parsai: Sadachar Ka Tabeez</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#991b1b" font-weight="700">Genre:</text>
            <text x="38" y="12" fill="#1f2937">Biting political-social satire</text>

            <text x="0" y="30" fill="#991b1b" font-weight="700">Target:</text>
            <text x="38" y="30" fill="#4b5563">Superficial anti-corruption fixes</text>

            <text x="0" y="48" fill="#991b1b" font-weight="700">Amulet:</text>
            <text x="42" y="48" fill="#4b5563">Illusion of talismanic morality</text>

            <rect x="0" y="62" width="195" height="74" rx="5" fill="#fef2f2" stroke="#fca5a5" />
            <text x="97" y="78" fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle">Systemic Reality</text>
            <text x="97" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">On the 31st, even the amulet cried:</text>
            <text x="97" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">"Take it, today is the 31st!"</text>
            <text x="97" y="122" fill="#991b1b" font-size="8.5" font-weight="600" text-anchor="middle">Corruption is systemic, not magical.</text>
        </g>
    </g>

    <!-- Essay 4: Mishra -->
    <g transform="translate(700, 335)" filter="url(#gCardSh)">
        <rect width="210" height="185" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.6" />
        <rect x="0" y="0" width="210" height="26" rx="8" fill="#047857" />
        <rect x="0" y="14" width="210" height="12" fill="#047857" />
        <text x="105" y="18" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">6. P.N. Mishra: Manoyog</text>

        <g transform="translate(10, 36)" font-size="9.5">
            <text x="0" y="12" fill="#065f46" font-weight="700">Era:</text>
            <text x="25" y="12" fill="#1f2937">Bharatendu period reflective essay</text>

            <text x="0" y="30" fill="#065f46" font-weight="700">Topic:</text>
            <text x="35" y="30" fill="#4b5563">Mental concentration &amp; resolve</text>

            <text x="0" y="48" fill="#065f46" font-weight="700">Style:</text>
            <text x="32" y="48" fill="#4b5563">Witty, colloquial, idiomatic prose</text>

            <rect x="0" y="62" width="190" height="74" rx="5" fill="#ecfdf5" stroke="#a7f3d0" />
            <text x="95" y="78" fill="#047857" font-size="9" font-weight="700" text-anchor="middle">Secret of Mastery</text>
            <text x="95" y="94" fill="#4b5563" font-size="8.5" text-anchor="middle">Without total mental focus (manoyog),</text>
            <text x="95" y="108" fill="#4b5563" font-size="8.5" text-anchor="middle">neither scholarship bears fruit</text>
            <text x="95" y="122" fill="#065f46" font-size="8.5" font-weight="600" text-anchor="middle">nor can life's goals be attained.</text>
        </g>
    </g>
</svg>
